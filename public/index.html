<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FLASH-CUT BROADCAST</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:crosshair;
    font-family:"Arial Black",Arial,sans-serif;user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden}

  /* ---------- HOST SCENE ---------- */
  #hostScene{position:absolute;inset:0;background:#0a0a12;
    background:radial-gradient(ellipse at 50% 40%,#1b1b2e 0%,#050508 75%)}
  #hostCam{position:absolute;inset:0;transform-origin:50% 38%}
  #keyLight{position:absolute;left:50%;top:0;width:140vmax;height:140vmax;
    transform:translate(-50%,-62%);
    background:radial-gradient(circle,rgba(255,240,210,.9) 0%,rgba(255,190,120,.25) 22%,transparent 55%);
    mix-blend-mode:screen;pointer-events:none}
  #rimLight{position:absolute;left:72%;top:8%;width:60vmax;height:60vmax;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(90,140,255,.55) 0%,transparent 55%);
    mix-blend-mode:screen;pointer-events:none}
  #shadowOverlay{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(200deg,transparent 35%,rgba(0,0,0,.85) 78%);
    mix-blend-mode:multiply}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.9'/></svg>")}
  #hostSvg{position:absolute;left:50%;top:50%;width:min(78vmin,560px);transform:translate(-50%,-50%)}

  #lowerThird{position:absolute;left:6%;bottom:8%;color:#fff;pointer-events:none}
  #lowerThird .bar{display:inline-block;background:#e11d2e;padding:.35em .8em;
    font-size:clamp(14px,2.4vw,26px);letter-spacing:.12em;transform:skewX(-8deg)}
  #lowerThird .sub{margin-top:.5em;font-size:clamp(10px,1.3vw,15px);letter-spacing:.35em;color:#bbb}

  /* ---------- FLASH CUTS ---------- */
  .flash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    will-change:transform,opacity}
  .flash .big{font-size:clamp(120px,34vmin,340px);line-height:1;
    filter:drop-shadow(0 0 40px rgba(255,255,255,.4))}
  .flash .label{position:absolute;bottom:10%;left:0;right:0;text-align:center;
    font-size:clamp(12px,2vw,22px);letter-spacing:.4em;color:#fff;text-shadow:0 0 12px #000}
  #flashClown{background:#e11d2e}
  #flashNews{background:#f5f2ea;color:#111}
  #flashDance{background:#7a2ff2}
  #flashDance .big{font-size:clamp(90px,26vmin,260px)}
  #flashGlitch{background:#000}
  #flashSkull{background:#ffd400}
  #flashWifi{background:#00c2a8}
  #newsBox{background:#111;color:#fff;padding:24px 40px;transform:rotate(-2deg);
    border:6px solid #e11d2e}
  #newsBox .hl{background:#e11d2e;padding:0 .2em}

  /* scanlines + vignette on flashes */
  .flash::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 3px,transparent 3px 6px)}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:50;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.9) 100%)}
  #whiteFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
  #shock{position:absolute;inset:0;box-shadow:inset 0 0 0 0 rgba(255,60,60,.9);
    pointer-events:none;z-index:40}
</style>
</head>
<body>
<div id="stage">

  <!-- HOST SCENE -->
  <div id="hostScene">
    <div id="hostCam">
      <div id="keyLight"></div>
      <div id="rimLight"></div>
      <svg id="hostSvg" viewBox="0 0 400 440">
        <defs>
          <radialGradient id="faceG" cx="38%" cy="32%" r="80%">
            <stop offset="0%" stop-color="#ffd9b3"/>
            <stop offset="55%" stop-color="#e8a877"/>
            <stop offset="100%" stop-color="#8a4a2b"/>
          </radialGradient>
          <linearGradient id="suitG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2b2f45"/>
            <stop offset="100%" stop-color="#10121c"/>
          </linearGradient>
        </defs>
        <!-- shoulders / suit -->
        <path d="M40 440 Q60 320 130 295 L270 295 Q340 320 360 440 Z" fill="url(#suitG)"/>
        <path d="M180 295 L200 340 L220 295 Z" fill="#fff"/>
        <path d="M194 300 L200 335 L206 300 Z" fill="#e11d2e"/>
        <!-- neck -->
        <rect x="178" y="255" width="44" height="55" rx="14" fill="#d19063"/>
        <!-- head -->
        <ellipse cx="200" cy="185" rx="98" ry="112" fill="url(#faceG)"/>
        <!-- dramatic half-shadow across face (animated) -->
        <path id="faceShadow" d="M200 73 Q298 150 292 250 Q282 312 200 297 L200 73 Z"
          fill="rgba(10,8,20,.45)"/>
        <!-- ears -->
        <ellipse cx="102" cy="190" rx="14" ry="22" fill="#e8a877"/>
        <ellipse cx="298" cy="190" rx="14" ry="22" fill="#b06b40"/>
        <!-- hair -->
        <path d="M104 160 Q108 62 200 58 Q292 62 296 160 Q270 110 200 104 Q130 110 104 160Z" fill="#2a1f18"/>
        <!-- brows -->
        <path id="browL" d="M138 158 Q160 146 182 156" stroke="#2a1f18" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path id="browR" d="M218 156 Q240 146 262 158" stroke="#2a1f18" stroke-width="9" fill="none" stroke-linecap="round"/>
        <!-- eyes -->
        <g id="eyes">
          <ellipse cx="160" cy="182" rx="15" ry="10" fill="#fff"/>
          <ellipse cx="240" cy="182" rx="15" ry="10" fill="#fff"/>
          <circle id="pupilL" cx="162" cy="183" r="6" fill="#1c1c22"/>
          <circle id="pupilR" cx="242" cy="183" r="6" fill="#1c1c22"/>
        </g>
        <!-- mouth (path morphs when shouting) -->
        <path id="mouth" d="M168 238 Q200 250 232 238" stroke="#5b2b18" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- mic flag -->
        <g transform="translate(120,330) rotate(-15)">
          <rect x="-22" y="0" width="44" height="30" fill="#e11d2e"/>
          <text x="0" y="22" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">LIVE</text>
        </g>
      </svg>
      <div id="shadowOverlay"></div>
    </div>
    <div id="grain"></div>
    <div id="lowerThird">
      <div class="bar">BREAKING: EVERYTHING IS FINE??</div>
      <div class="sub">LIVE &nbsp;•&nbsp; CH 7 NEWS &nbsp;•&nbsp; 24H LOOP</div>
    </div>
  </div>

  <!-- FLASH CUTS -->
  <div class="flash" id="flashClown"><div class="big">🤡</div><div class="label">CLOWN WORLD.exe</div></div>
  <div class="flash" id="flashNews">
    <div id="newsBox"><div style="font-size:clamp(16px,3vw,32px);font-weight:900">
      <span class="hl">ALERT:</span> EVERYTHING IS<br>WORSE THAN REPORTED</div></div>
    <div class="label">CITIZEN FOOTAGE — VERIFIED*  (*UNVERIFIED)</div>
  </div>
  <div class="flash" id="flashDance"><div class="big">🕺💃🕺</div><div class="label">TRENDING #DANCE</div></div>
  <div class="flash" id="flashGlitch"><div class="big" style="font-family:monospace;color:#0f0;text-shadow:4px 0 #f0f,-4px 0 #0ff">404<br>TRUTH<br>NOT FOUND</div></div>
  <div class="flash" id="flashSkull"><div class="big">💀🔥</div><div class="label">RATIO'D (4.2M LIKES)</div></div>
  <div class="flash" id="flashWifi"><div class="big">📶</div><div class="label">CONNECTION LOST — BELIEVE ANYWAY</div></div>

  <div id="shock"></div>
  <div id="vignette"></div>
  <div id="whiteFlash"></div>
</div>

<script>
const flashIds = ["#flashClown","#flashNews","#flashDance","#flashGlitch","#flashSkull","#flashWifi"];
const tl = gsap.timeline({repeat:-1, repeatDelay:1.2});

// === ACT 1: aggressive push-in on host ===
tl.set(flashIds.join(","), {display:"none"})
  .set("#hostScene",{scale:1,opacity:1})
  // long dramatic zoom toward the face
  .to("#hostCam",{scale:3.4, xPercent:-4, duration:4.5, ease:"power3.inOut"},"zoom")
  // lighting turns harsh: key light slams in, shadow deepens
  .to("#keyLight",{x:"-14vw", scale:.6, duration:3.5, ease:"power2.in"},"zoom")
  .to("#faceShadow",{attr:{d:"M200 73 Q268 130 278 250 Q268 316 200 297 L200 73 Z"}, duration:3, ease:"power2.inOut"},"zoom")
  .to("#shadowOverlay",{opacity:1, duration:3},"zoom")
  .to("#rimLight",{opacity:1.4, duration:2},"zoom")
  // face reacts: brows furrow, pupils shrink, mouth opens into shout
  .to("#browL",{attr:{d:"M138 150 Q160 142 184 158"}, duration:1.2},"zoom+=1.5")
  .to("#browR",{attr:{d:"M216 158 Q240 142 262 150"}, duration:1.2},"zoom+=1.5")
  .to("#pupilL,#pupilR",{attr:{r:3.5}, duration:.8},"zoom+=1.8")
  .to("#mouth",{attr:{d:"M166 230 Q200 210 234 230 Q200 268 166 230 Z", fill:"#3a150a", stroke:"#5b2b18"}, duration:.6},"zoom+=2.2")
  .to("#hostScene",{filter:"contrast(1.25) saturate(1.2)", duration:2.5},"zoom+=2")
  // camera shake as he shouts
  .to("#hostCam",{keyframes:[{x:"+=1.2",y:"+=0.8"},{x:"-=1.6",y:"-=1"},{x:"+=1",y:"+=0.6"},{x:0,y:0}], duration:.5, ease:"none", repeat:5},"zoom+=2.4")
  .to("#shock",{boxShadow:"inset 0 0 180px 20px rgba(255,60,60,.35)", duration:.5},"zoom+=2.4")

  // === ACT 2: strobe of flash cuts ===
  flashIds.forEach((id,i)=>{
    tl.set(id,{display:"flex"})
      .fromTo(id,{scale:1.35,opacity:0},{scale:1,opacity:1,duration:.06,ease:"power4.out"},"cut"+i)
      .to(id,{opacity:0,duration:.07},"cut"+i+"+=0.13")
      .set(id,{display:"none"},"cut"+i+"+=0.21")
      // white frame-flash between cuts
      .fromTo("#whiteFlash",{opacity:.9},{opacity:0,duration:.1},"cut"+i)
      // cut counter-jitter on the zoomed host so returning feels violent
      .to("#hostCam",{x:(i%2? "+=3":"-=3"), y:(i%2? "-=2":"+=2"), duration:.06},"cut"+i)
  });

// === ACT 3: snap back, breathe, loop ===
tl.set("#hostScene",{opacity:0})
  .to("#whiteFlash",{opacity:1,duration:.05})
  .set("#hostCam",{scale:1, filter:"contrast(1) saturate(1)", xPercent:0, x:0, y:0})
  .set("#keyLight",{x:"0vw", scale:1})
  .set("#faceShadow",{attr:{d:"M200 73 Q298 150 292 250 Q282 312 200 297 L200 73 Z"}})
  .set("#browL",{attr:{d:"M138 158 Q160 146 182 156"}})
  .set("#browR",{attr:{d:"M218 156 Q240 146 262 158"}})
  .set("#pupilL,#pupilR",{attr:{r:6}})
  .set("#mouth",{attr:{d:"M168 238 Q200 250 232 238", fill:"none", stroke:"#5b2b18"}})
  .set("#shock",{boxShadow:"inset 0 0 0 0 rgba(255,60,60,0)"})
  .to("#hostScene",{opacity:1,duration:.08})
  .to("#whiteFlash",{opacity:0,duration:.25});

// subtle ambient: blinking light on mic, idle eye drift
gsap.to("#pupilL",{x:2,duration:2,yoyo:true,repeat:-1,ease:"sine.inOut",delay:1});
gsap.to("#pupilR",{x:2,duration:2,yoyo:true,repeat:-1,ease:"sine.inOut",delay:1});
</script>
</body>
</html>
