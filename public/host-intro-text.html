<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host Intro — Bold Text Reveal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: "Archivo Black", "Arial Black", Impact, sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* subtle vignette for cinematic feel */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }
  /* the "host" — calm silhouette looking into the lens */
  .host {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 42vmin; height: 72vmin;
  }
  .head {
    position: absolute;
    bottom: 46vmin; left: 50%;
    transform: translateX(-50%);
    width: 26vmin; height: 32vmin;
    background: radial-gradient(ellipse at 50% 45%, #242424 0%, #161616 60%, #101010 100%);
    border-radius: 48% 48% 46% 46% / 55% 55% 45% 45%;
    box-shadow: 0 0 8vmin rgba(255,255,255,0.04) inset;
  }
  /* lens-glint eyes, calm and steady */
  .eye {
    position: absolute;
    top: 42%;
    width: 3.2vmin; height: 1.4vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,255,255,0.05) 70%, transparent);
    filter: blur(1px);
  }
  .eye.l { left: 26%; }
  .eye.r { right: 26%; }
  .shoulders {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 60vmin; height: 50vmin;
    background: radial-gradient(ellipse at 50% 0%, #1c1c1c 0%, #121212 55%, #0d0d0d 100%);
    border-radius: 50% 50% 0 0 / 90% 90% 0 0;
  }
  /* rim light */
  .rim {
    position: absolute;
    bottom: 46vmin; left: 50%;
    transform: translateX(-50%);
    width: 28vmin; height: 34vmin;
    border-radius: 48% 48% 46% 46% / 55% 55% 45% 45%;
    box-shadow: -0.6vmin -0.6vmin 3vmin rgba(120,160,255,0.10) inset;
    pointer-events: none;
  }
  /* the bold text */
  .headline {
    position: relative;
    z-index: 10;
    color: #ffffff;
    font-size: clamp(3rem, 11vw, 9rem);
    letter-spacing: 0.02em;
    line-height: 0.95;
    text-align: center;
    text-transform: uppercase;
    text-shadow: 0 0 6vmin rgba(0,0,0,0.9), 0 0 12vmin rgba(0,0,0,0.8);
    perspective: 600px;
  }
  .word {
    display: inline-block;
    transform-origin: 50% 100%;
  }
  .sub {
    display: block;
    margin-top: 2.5vmin;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(0.8rem, 2vw, 1.4rem);
    letter-spacing: 0.55em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="host">
    <div class="shoulders"></div>
    <div class="head">
      <div class="eye l"></div>
      <div class="eye r"></div>
    </div>
    <div class="rim"></div>
  </div>
  <div class="vignette"></div>
  <div class="headline">
    <span class="word">This</span>
    <span class="word">Changes</span>
    <span class="word">Everything</span>
    <span class="sub" id="sub">Stay with me</span>
  </div>
</div>

<script>
const tl = gsap.timeline({ delay: 0.4 });

// 1) Background darkens — host dims into the shadows
tl.to(".host", {
  filter: "brightness(0.25) blur(2px)",
  duration: 1.4,
  ease: "power2.inOut"
}, 0)
tl.to(".vignette", {
  opacity: 1,
  duration: 1.4,
  ease: "power2.inOut"
}, 0);

// 2) Bold text pops in — punchy scale + slight overshoot
tl.from(".word", {
  scale: 0.2,
  opacity: 0,
  y: 60,
  rotationX: -55,
  duration: 0.55,
  ease: "back.out(2.2)",
  stagger: 0.12
}, 1.2);

// 3) Sub-line slides in beneath
tl.from("#sub", {
  opacity: 0,
  y: 25,
  letterSpacing: "0.9em",
  duration: 0.7,
  ease: "power3.out"
}, 1.9);

// 4) Subtle settle: text breathes, host stays calm in the dark
tl.to(".word", {
  textShadow: "0 0 6vmin rgba(0,0,0,0.9), 0 0 2vmin rgba(255,255,255,0.15)",
  duration: 0.8,
  ease: "sine.inOut"
}, 2.2);
</script>
</body>
</html>
