<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta data-composition-id="launch-day" data-width="1920" data-height="1080" />
    <title>Launch day</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="fx/textures.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f4efe3; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Each countdown sheet is a full-bleed paper layer with a torn bottom edge. */
      .sheet { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .sheet .num {
        position: absolute; left: 0; top: 40px; width: 1920px; text-align: center;
        font-family: "Anton", sans-serif; font-size: 900px; line-height: 1;
      }
      .sheet .ht { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0.55; }
      #s3 { background-color: #ff5b45; }
      #s3 .num { color: #07142e; }
      #s2 { background-color: #7fb2ff; }
      #s2 .num { color: #07142e; }
      #s1 { background-color: #c5ef26; }
      #s1 .num { color: #07142e; }
      .sheet .paper { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0.9; background-color: transparent; }

      /* Halftone burst behind the product. */
      #burst {
        position: absolute; left: 960px; top: 540px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px;
        border-radius: 50%;
        background: radial-gradient(circle, #ff5b45 0 18%, #ff8a5c 30%, #ffd0a8 52%, transparent 70%);
      }
      #burst-dots {
        position: absolute; left: 960px; top: 540px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px;
        border-radius: 50%; --ht-color: rgba(7, 20, 46, 0.35); --ht-size: 3px;
        -webkit-mask-image: radial-gradient(circle, transparent 20%, #000 40%, transparent 68%);
        mask-image: radial-gradient(circle, transparent 20%, #000 40%, transparent 68%);
      }

      /* The product card. */
      #card {
        position: absolute; left: 560px; top: 250px; width: 800px; height: 520px; border-radius: 36px;
        background: #07142e; box-shadow: 0 60px 120px -40px rgba(7, 20, 46, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.06) inset;
        overflow: hidden;
      }
      #card .glow {
        position: absolute; left: -200px; top: -260px; width: 900px; height: 700px; border-radius: 50%;
        background: radial-gradient(circle, rgba(197, 239, 38, 0.35), transparent 65%);
      }
      #card .logo { position: absolute; left: 70px; top: 70px; display: flex; align-items: center; gap: 26px; }
      #card svg { width: 96px; height: 106px; }
      #card .word { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 128px; letter-spacing: -6px; color: #f7f5ef; line-height: 1; }
      #card .ver { position: absolute; left: 76px; top: 230px; font-family: "Anton", sans-serif; font-size: 190px; line-height: 1; color: #c5ef26; letter-spacing: 4px; }
      #card .what { position: absolute; left: 80px; bottom: 64px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 38px; color: rgba(247, 245, 239, 0.75); }

      /* Sticker badge. */
      #sticker {
        position: absolute; left: 1250px; top: 180px; width: 250px; height: 250px; border-radius: 50%;
        background: #f7f5ef; display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: "Caveat", cursive; font-weight: 700; font-size: 62px; line-height: 0.95; color: #ff5b45;
        box-shadow: 0 14px 30px -10px rgba(7, 20, 46, 0.45);
        border: 6px dashed rgba(255, 91, 69, 0.4);
      }
      #avail {
        position: absolute; left: 0; width: 1920px; top: 850px; text-align: center;
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 96px; letter-spacing: -4px; color: #07142e;
      }
      #avail .ch { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="stage" class="tx-paper">
      <div id="burst"></div>
      <div id="burst-dots" class="tx-halftone"></div>
      <div id="card">
        <div class="glow"></div>
        <div class="logo">
          <svg viewBox="0 0 210 230" aria-hidden="true"><path d="M18 14 L196 115 L18 216 Z" fill="#c5ef26" stroke="#c5ef26" stroke-width="20" stroke-linejoin="round" /></svg>
          <span class="word">byreel</span>
        </div>
        <div class="ver">2.0</div>
        <div class="what">Camera moves, textures, 4K at 60 fps</div>
      </div>
      <div id="sticker">out<br />now!</div>
      <div id="avail">Available today.</div>

      <div class="sheet" id="s1"><div class="ht tx-halftone" style="--ht-color: rgba(7,20,46,.18)"></div><div class="paper tx-paper"></div><div class="num">1</div></div>
      <div class="sheet" id="s2"><div class="ht tx-halftone" style="--ht-color: rgba(7,20,46,.18)"></div><div class="paper tx-paper"></div><div class="num">2</div></div>
      <div class="sheet" id="s3"><div class="ht tx-halftone" style="--ht-color: rgba(7,20,46,.18)"></div><div class="paper tx-paper"></div><div class="num">3</div></div>
    </div>

    <script src="fx/kit.js"></script>
    <script src="player.js"></script>
    <script>
      /* A torn edge: a jagged polygon from a seeded walk, used as each sheet's clip-path. */
      var rand = HF.seeded(404);
      function tornClip(y) {
        var pts = ["0% 0%", "100% 0%"];
        for (var x = 100; x >= 0; x -= 2.5) pts.push(x + "% " + (y + (rand() - 0.5) * 3.2).toFixed(2) + "%");
        return "polygon(" + pts.join(", ") + ")";
      }
      var sheets = ["#s3", "#s2", "#s1"];
      /* The torn edge sits just inside the bottom of each sheet and never changes; the whole
         sheet is ripped upward, so the edge reads as paper rather than a morphing shape. */
      sheets.forEach(function (s) { gsap.set(s, { clipPath: tornClip(97), transformOrigin: "50% 0%" }); });
      var avail = HF.split("#avail");

      gsap.set("#card", { y: 960, rotation: -8 });
      gsap.set("#sticker", { scale: 0, rotation: -40 });
      gsap.set("#burst", { scale: 0 });
      gsap.set("#burst-dots", { scale: 0, rotation: 0 });
      gsap.set(avail, { yPercent: 120, opacity: 0 });
      gsap.set(".sheet .num", { scale: 1.25, opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      /* 0–3.4s: 3, 2, 1. Each numeral punches in, then its sheet tears away upward. */
      [0, 1.1, 2.2].forEach(function (t, i) {
        var s = sheets[i];
        tl.to(s + " .num", { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, t + 0.05);
        tl.to(s + " .num", { scale: 0.92, duration: 0.5, ease: "sine.inOut" }, t + 0.4);
        tl.to(s, { y: -1180, rotation: i % 2 ? 4 : -4, duration: 0.42, ease: "power3.in" }, t + 0.8);
      });

      /* 3.2s: halftone burst blooms; the product card slams in; the sticker slaps on. */
      tl.to("#burst", { scale: 1, duration: 0.9, ease: "expo.out" }, 3.1);
      tl.to("#burst-dots", { scale: 1, rotation: 25, duration: 1.4, ease: "expo.out" }, 3.15);
      tl.to("#card", { y: 0, rotation: -2, duration: 0.8, ease: "back.out(1.4)" }, 3.25);
      tl.to("#sticker", { scale: 1, rotation: 12, duration: 0.5, ease: "back.out(3)" }, 3.9);
      tl.to(avail, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power4.out", stagger: 0.03 }, 4.1);

      /* 4.8–8.6s: hold with life: card floats, burst spins slowly, sticker wobbles. */
      tl.to("#card", { y: -16, rotation: 0, duration: 1.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.8);
      tl.to("#burst-dots", { rotation: 60, duration: 4, ease: "none" }, 4.55);
      tl.to("#sticker", { rotation: 4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.6);

      /* 8.6–10s: the 3 sheet drops back over everything, so the loop starts on it. */
      tl.to(avail, { opacity: 0, duration: 0.3 }, 8.6);
      tl.set("#s3 .num", { scale: 1.25, opacity: 0 }, 8.6);
      tl.to("#s3", { y: 0, rotation: 0, duration: 0.6, ease: "power3.out" }, 8.8);
      tl.set(["#s2", "#s1"], { y: 0, rotation: 0 }, 9.45);
      tl.set(["#s2 .num", "#s1 .num"], { scale: 1.25, opacity: 0 }, 9.45);
      tl.set("#card", { y: 960, rotation: -8 }, 9.45);
      tl.set("#sticker", { scale: 0, rotation: -40 }, 9.45);
      tl.set(["#burst", "#burst-dots"], { scale: 0, rotation: 0 }, 9.45);
      tl.set(avail, { yPercent: 120, opacity: 0 }, 9.45);

      HF.grain(tl, { opacity: 0.12, duration: 10 });
      tl.set({}, {}, 10);
      window.__timelines = window.__timelines || {};
      window.__timelines["launch-day"] = tl;
    </script>
  </body>
</html>
