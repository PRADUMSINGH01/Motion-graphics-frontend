<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta data-composition-id="halftone-field" data-width="1920" data-height="1080" />
    <title>Halftone field</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="fx/textures.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07142e; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07142e; }
      #dots { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #dots circle { fill: #c5ef26; }
      #shade { background: linear-gradient(180deg, transparent 55%, rgba(7, 20, 46, 0.92) 88%); }
      .line {
        position: absolute; left: 120px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
        font-size: 120px; letter-spacing: -6px; line-height: 1; color: #f7f5ef; overflow: hidden; padding-bottom: 10px;
      }
      .line span { display: inline-block; }
      #l1 { top: 800px; }
      #l2 { top: 800px; left: 720px; color: #c5ef26; }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="dots" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <div id="shade" class="fx-layer"></div>
      <div class="line" id="l1"><span>Every dot,</span></div>
      <div class="line" id="l2"><span>directed.</span></div>
    </div>

    <script src="fx/kit.js"></script>
    <script src="player.js"></script>
    <script>
      var GAP = 30, COLS = 64, ROWS = 36, R = 13.5, CX = 960, CY = 520, DUR = 10;
      var svg = document.getElementById("dots");
      var dots = [];
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var x = c * GAP + GAP / 2, y = r * GAP + GAP / 2;
          var el = document.createElementNS(HF.NS, "circle");
          el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("r", 0);
          svg.appendChild(el);
          dots.push({ el: el, x: x, y: y, d: Math.hypot(x - CX, y - CY) });
        }
      }

      function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function smooth(a, b, t) { var k = clamp((t - a) / (b - a)); return k * k * (3 - 2 * k); }
      /* Soft inside-test for the byreel play triangle (pointing right). */
      var A = [690, 230], B = [1290, 520], C = [690, 810];
      function edge(p, q, x, y) { return ((q[0] - p[0]) * (y - p[1]) - (q[1] - p[1]) * (x - p[0])) / Math.hypot(q[0] - p[0], q[1] - p[1]); }
      function tri(x, y) {
        var m = Math.min(edge(A, B, x, y), edge(B, C, x, y), edge(C, A, x, y)); /* > 0 inside */
        return clamp(m / 40 + 0.5);
      }
      function ring(d) { return clamp(1 - Math.abs(d - 330) / 70); }

      /*
       * Every dot's radius is a pure function of time, so any frame can be rendered on its own.
       * Shape weights come from the same clock, not from separate tweens.
       */
      function render(t) {
        var toTri = smooth(1.9, 3.0, t) * (1 - smooth(4.6, 5.6, t));
        var toRing = smooth(4.6, 5.6, t) * (1 - smooth(7.0, 8.0, t));
        var wave = 1 - Math.max(toTri, toRing) * 0.85;
        var pulse = 1 + 0.08 * Math.sin(t * Math.PI * 2);
        var phase = (t / DUR) * Math.PI * 2 * 5; /* five ripples per loop: seamless */
        for (var i = 0; i < dots.length; i++) {
          var p = dots[i];
          var w = 0.5 + 0.5 * Math.sin(p.d * 0.032 - phase);
          var v = wave * w * 0.75 + toTri * tri(p.x, p.y) * pulse + toRing * ring(p.d) * pulse;
          p.el.setAttribute("r", (R * clamp(v)).toFixed(2));
        }
      }

      gsap.set(["#l1 span", "#l2 span"], { yPercent: 110 });

      var tl = gsap.timeline({ paused: true });
      /* One clock tween drives the field; the modifier renders it (runs on seeks too). */
      tl.fromTo({ t: 0 }, { t: 0 }, {
        t: DUR, duration: DUR, ease: "none",
        modifiers: { t: function (v) { render(parseFloat(v)); return v; } },
      }, 0);

      tl.to("#l1 span", { yPercent: 0, duration: 0.6, ease: "power4.out" }, 3.0);
      tl.to("#l2 span", { yPercent: 0, duration: 0.6, ease: "power4.out" }, 5.4);
      tl.to(["#l1 span", "#l2 span"], { yPercent: -110, duration: 0.5, ease: "power3.in", stagger: 0.08 }, 7.6);
      tl.set(["#l1 span", "#l2 span"], { yPercent: 110 }, 8.3);

      HF.grain(tl, { opacity: 0.1, duration: DUR });
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["halftone-field"] = tl;
    </script>
  </body>
</html>
