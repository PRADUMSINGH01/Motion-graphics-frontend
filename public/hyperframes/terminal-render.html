<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta data-composition-id="terminal-render" data-width="1920" data-height="1080" />
    <title>Terminal render</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="fx/textures.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020409; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #020409; }

      /* The tube: rounded glass, inner glow, curvature vignette. */
      #tube {
        position: absolute; left: 60px; top: 50px; width: 1800px; height: 980px; border-radius: 60px / 50px; overflow: hidden;
        background: radial-gradient(ellipse 80% 75% at 50% 50%, #0b1a33 0%, #050b16 70%, #02050b 100%);
        box-shadow: inset 0 0 120px rgba(197, 239, 38, 0.06), inset 0 0 0 3px rgba(255, 255, 255, 0.04);
      }
      #term {
        position: absolute; left: 100px; top: 120px; width: 1620px;
        font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 48px; line-height: 1.7;
        color: #c5ef26;
        /* phosphor bloom + RGB fringing */
        text-shadow: 0 0 10px rgba(197, 239, 38, 0.55), -2px 0 rgba(255, 60, 120, 0.35), 2px 0 rgba(60, 160, 255, 0.35);
      }
      #term .dim { color: #6e8b2a; }
      #term .ok { color: #f7f5ef; }
      #cmd .ch { display: none; }
      #cursor { display: inline-block; width: 28px; height: 52px; background: #c5ef26; vertical-align: -6px; box-shadow: 0 0 12px rgba(197, 239, 38, 0.8); }
      .log { opacity: 0; white-space: pre; }
      #bar { white-space: pre; opacity: 0; }

      /* The finished render: a neon title. */
      #out { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #neon {
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 250px; letter-spacing: -8px; line-height: 0.95;
        color: #ffe9f6; text-align: center;
        text-shadow: 0 0 8px #fff, 0 0 26px #ff4fa8, 0 0 60px #ff4fa8, 0 0 120px #ff2d95;
      }
      #neon b { color: #eaffb0; text-shadow: 0 0 8px #fff, 0 0 26px #c5ef26, 0 0 60px #9fd11a, 0 0 120px #9fd11a; font-weight: 800; }
      #file { margin-top: 40px; font-family: "JetBrains Mono", monospace; font-size: 34px; color: rgba(247, 245, 239, 0.6); }

      #scan { z-index: 20; opacity: 0.55; }
      #roll {
        position: absolute; left: 0; width: 1800px; height: 220px; z-index: 21;
        background: linear-gradient(180deg, transparent, rgba(197, 239, 38, 0.06), transparent);
      }
      /* Glitch slices: copies of the tube offset sideways for a few frames. */
      .slice { position: absolute; left: 0; top: 0; width: 1800px; z-index: 22; background: rgba(255, 79, 168, 0.18); mix-blend-mode: screen; opacity: 0; }
      #flash { position: absolute; inset: 0; background: #f7f5ef; opacity: 0; z-index: 30; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="terminal-render" data-width="1920" data-height="1080">
      <div id="tube">
        <div id="term">
          <div><span class="dim">$</span> <span id="cmd">byreel render "neon title, glitch cut, 10s"</span><span id="cursor"></span></div>
          <div class="log"><span class="dim">→</span> reading prompt              <span class="ok">done</span></div>
          <div class="log"><span class="dim">→</span> 3 scenes · 300 frames · 30 fps</div>
          <div class="log"><span class="dim">→</span> camera: crash zoom, whip pan</div>
          <div class="log"><span class="dim">→</span> finish: neon glow, CRT, grain</div>
          <div id="bar"></div>
          <div class="log" id="done"><span class="ok">✓ rendered</span> <span class="dim">title-card.mp4</span></div>
        </div>
        <div id="out">
          <div id="neon">It's a<br /><b>wrap.</b></div>
          <div id="file">title-card.mp4 · 0:10</div>
        </div>
        <div id="scan" class="fx-layer tx-scanlines" style="width: 1800px; height: 980px"></div>
        <div id="roll"></div>
        <div class="slice" id="g1" style="height: 90px"></div>
        <div class="slice" id="g2" style="height: 40px"></div>
        <div class="slice" id="g3" style="height: 120px"></div>
      </div>
      <div id="flash"></div>
    </div>

    <script src="fx/kit.js"></script>
    <script src="player.js"></script>
    <script>
      var rand = HF.seeded(31);
      var cmd = HF.split("#cmd");
      var logs = gsap.utils.toArray(".log");
      var barEl = document.getElementById("bar");
      var W = 30;
      function bar(v) {
        var n = Math.round((v / 100) * W);
        return "[" + "█".repeat(n) + "░".repeat(W - n) + "] " + String(Math.round(v)).padStart(3, " ") + "%";
      }
      barEl.textContent = bar(0);

      var tl = gsap.timeline({ paused: true });

      /* A slow bright band rolls down the tube the whole time. */
      tl.fromTo("#roll", { y: -240 }, { y: 1000, duration: 5, ease: "none", repeat: 1 }, 0);

      /* 0.3–2.4s: the command types out, a character per frame-ish. */
      cmd.forEach(function (c, i) { tl.set(c, { display: "inline" }, 0.3 + i * 0.045); });
      tl.to("#cursor", { opacity: 0, duration: 0.01, yoyo: true, repeat: 3, repeatDelay: 0.25 }, 0);
      tl.set("#cursor", { opacity: 0 }, 2.5);

      /* 2.5–3.6s: logs stream in. */
      logs.slice(0, 4).forEach(function (l, i) { tl.to(l, { opacity: 1, duration: 0.06 }, 2.5 + i * 0.26); });

      /* 3.7–6.0s: progress bar (text tweened with a modifier: renders on seeks too). */
      tl.set("#bar", { opacity: 1 }, 3.7);
      tl.fromTo(barEl, { innerText: 0 }, { innerText: 100, duration: 2.2, ease: "power1.inOut", modifiers: { innerText: bar } }, 3.75);
      tl.to("#done", { opacity: 1, duration: 0.06 }, 6.05);

      /* 6.4s: glitch cut — RGB slices jump, the tube flashes, the render appears. */
      function glitch(at) {
        ["#g1", "#g2", "#g3"].forEach(function (g, i) {
          for (var k = 0; k < 4; k++) {
            tl.set(g, { opacity: 1, x: (rand() - 0.5) * 300, y: 100 + rand() * 760 }, at + k * 0.05 + i * 0.012);
          }
          tl.set(g, { opacity: 0, x: 0 }, at + 0.24);
        });
        tl.set("#term", { x: 18, skewX: -6 }, at + 0.05);
        tl.set("#term", { x: -10, skewX: 3 }, at + 0.12);
        tl.set("#term", { x: 0, skewX: 0 }, at + 0.2);
      }
      glitch(6.35);
      tl.to("#flash", { opacity: 0.7, duration: 0.05 }, 6.58);
      tl.set("#term", { opacity: 0 }, 6.62);
      tl.set("#out", { opacity: 1 }, 6.62);
      tl.to("#flash", { opacity: 0, duration: 0.3 }, 6.63);

      /* 6.7–9.0s: neon tube flicker, then a steady glow. */
      [[6.75, 0.3], [6.83, 1], [6.9, 0.2], [6.97, 1], [7.6, 0.55], [7.65, 1]].forEach(function (f) {
        tl.set("#neon", { opacity: f[1] }, f[0]);
      });
      tl.fromTo("#neon", { scale: 1.06 }, { scale: 1, duration: 1.4, ease: "expo.out", immediateRender: false }, 6.62);

      /* 9.0s: glitch back to an empty prompt to loop. */
      glitch(9.2);
      tl.set("#out", { opacity: 0 }, 9.46);
      tl.set("#term", { opacity: 1 }, 9.46);
      tl.set(cmd, { display: "none" }, 9.46);
      tl.set(logs, { opacity: 0 }, 9.46);
      tl.set("#bar", { opacity: 0 }, 9.46);
      tl.set("#cursor", { opacity: 1 }, 9.46);

      HF.grain(tl, { opacity: 0.12, duration: 10 });
      tl.set({}, {}, 10);
      window.__timelines = window.__timelines || {};
      window.__timelines["terminal-render"] = tl;
    </script>
  </body>
</html>
