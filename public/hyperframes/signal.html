<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta data-composition-id="signal" data-width="1920" data-height="1080" />
    <title>Signal</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07142e; }
      #stage {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse 70% 60% at 70% 40%, #0e2552 0%, #07142e 70%);
      }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 1560px 400px; }
      #chart { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      .grid line { stroke: rgba(127, 178, 255, 0.14); stroke-width: 2; }

      #count {
        position: absolute; left: 160px; top: 96px; font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800; font-size: 150px; letter-spacing: -6px; line-height: 1; color: #c5ef26;
        font-variant-numeric: tabular-nums;
      }
      #label {
        position: absolute; left: 166px; top: 250px; font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 500; font-size: 40px; color: rgba(247, 245, 239, 0.72);
      }
      .pill {
        position: absolute; padding: 12px 24px; border-radius: 999px; white-space: nowrap;
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 34px;
        color: #07142e; background: #f7f5ef; transform-origin: 50% 100%;
        box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);
      }
      .pill::after {
        content: ""; position: absolute; left: 50%; bottom: -10px; width: 20px; height: 20px;
        margin-left: -10px; background: inherit; transform: rotate(45deg); border-radius: 3px;
      }
      .pill.lime { background: #c5ef26; }
      .pill.coral { background: #ff5b45; color: #f7f5ef; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="cam">
        <svg id="chart" viewBox="0 0 1920 1080" aria-hidden="true">
          <defs>
            <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c5ef26" stop-opacity="0.42" />
              <stop offset="1" stop-color="#c5ef26" stop-opacity="0" />
            </linearGradient>
            <clipPath id="reveal"><rect id="reveal-rect" x="160" y="0" width="0" height="1080" /></clipPath>
            <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
              <feGaussianBlur stdDeviation="14" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>
          <g class="grid" id="grid"></g>
          <g id="bars"></g>
          <path id="area" fill="url(#fade)" clip-path="url(#reveal)" />
          <path id="curve" fill="none" stroke="#c5ef26" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
          <g id="head" filter="url(#glow)">
            <circle r="30" fill="rgba(197,239,38,0.25)" />
            <circle r="15" fill="#f7f5ef" />
          </g>
        </svg>
        <div class="pill" id="p1">+42% this week</div>
        <div class="pill coral" id="p2">first clip went viral</div>
        <div class="pill lime" id="p3">2.4M</div>
      </div>
      <div id="count">0</div>
      <div id="label">views this month</div>
    </div>

    <script src="vendor/DrawSVGPlugin.min.js"></script>
    <script src="vendor/MotionPathPlugin.min.js"></script>
    <script src="player.js"></script>
    <script>
      gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
      var NS = "http://www.w3.org/2000/svg";
      var X0 = 160, X1 = 1760, Y0 = 330, Y1 = 900;

      /* Grid */
      var grid = document.getElementById("grid");
      for (var i = 0; i <= 8; i++) {
        var h = document.createElementNS(NS, "line");
        var y = Y0 + (i * (Y1 - Y0)) / 8;
        h.setAttribute("x1", X0); h.setAttribute("x2", X1); h.setAttribute("y1", y); h.setAttribute("y2", y);
        grid.appendChild(h);
      }

      /* The curve: Catmull-Rom through hand-placed points, emitted as cubic Béziers. */
      var pts = [[160, 870], [330, 830], [500, 846], [660, 724], [820, 766], [980, 612], [1130, 650], [1290, 474], [1440, 528], [1600, 372], [1760, 318]];
      function catmull(p) {
        var d = "M" + p[0][0] + "," + p[0][1];
        for (var i = 0; i < p.length - 1; i++) {
          var a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
          d += " C" + (b[0] + (c[0] - a[0]) / 6) + "," + (b[1] + (c[1] - a[1]) / 6) + " " +
            (c[0] - (e[0] - b[0]) / 6) + "," + (c[1] - (e[1] - b[1]) / 6) + " " + c[0] + "," + c[1];
        }
        return d;
      }
      var d = catmull(pts);
      var curve = document.getElementById("curve");
      curve.setAttribute("d", d);
      document.getElementById("area").setAttribute("d", d + " L" + X1 + "," + Y1 + " L" + X0 + "," + Y1 + " Z");

      /* Volume bars sit under the curve, one per 100px. */
      var bars = document.getElementById("bars");
      var total = curve.getTotalLength();
      function lengthAtX(x) {
        var lo = 0, hi = total;
        for (var k = 0; k < 30; k++) {
          var m = (lo + hi) / 2;
          if (curve.getPointAtLength(m).x < x) lo = m; else hi = m;
        }
        return (lo + hi) / 2;
      }
      for (var bx = 210; bx < X1; bx += 100) {
        var curveY = curve.getPointAtLength(lengthAtX(bx)).y;
        var r = document.createElementNS(NS, "rect");
        r.setAttribute("x", bx - 26); r.setAttribute("width", 52);
        r.setAttribute("y", curveY + 40); r.setAttribute("height", Y1 - curveY - 40);
        r.setAttribute("rx", 10);
        r.setAttribute("fill", "rgba(127,178,255,0.2)");
        bars.appendChild(r);
      }
      var barEls = gsap.utils.toArray("#bars rect");

      /* Milestone pills sit just above their point on the curve. */
      var DRAW_AT = 0.5, DRAW_FOR = 3.2;
      var milestones = [["#p1", 660], ["#p2", 1290], ["#p3", 1760]].map(function (m) {
        var L = lengthAtX(m[1]);
        var pt = curve.getPointAtLength(L);
        var el = document.querySelector(m[0]);
        gsap.set(el, { left: pt.x, top: pt.y - 44, xPercent: -50, yPercent: -100, scale: 0 });
        return { el: el, at: DRAW_AT + DRAW_FOR * (L / total) };
      });

      /* The count is tweened on the element itself with a formatting modifier: modifiers run on
         every render, including frame-accurate seeks, where onUpdate callbacks are suppressed. */
      var countEl = document.getElementById("count");
      var formatCount = { innerText: function (v) { return Math.round(v).toLocaleString("en-US"); } };

      gsap.set(curve, { drawSVG: "0% 0%" });
      gsap.set("#head", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(barEls, { scaleY: 0, transformOrigin: "50% 100%" });
      gsap.set("#grid line", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(["#count", "#label"], { opacity: 0, y: 30 });

      var tl = gsap.timeline({ paused: true });

      /* 0–0.7s: grid and headline counter. */
      tl.to("#grid line", { scaleX: 1, duration: 0.6, ease: "power3.out", stagger: 0.03 }, 0);
      tl.to(["#count", "#label"], { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.15);

      /* 0.5–3.7s: the line draws itself; the glowing head rides its tip; the count follows. */
      tl.to("#head", { scale: 1, duration: 0.3, ease: "back.out(3)" }, DRAW_AT - 0.1);
      tl.to(curve, { drawSVG: "0% 100%", duration: DRAW_FOR, ease: "none" }, DRAW_AT);
      tl.to("#head", {
        motionPath: { path: curve, align: curve, alignOrigin: [0.5, 0.5] },
        duration: DRAW_FOR, ease: "none",
      }, DRAW_AT);
      tl.to("#reveal-rect", { attr: { width: X1 - X0 + 20 }, duration: DRAW_FOR, ease: "none" }, DRAW_AT);
      tl.fromTo(countEl, { innerText: 0 }, { innerText: 2418906, duration: DRAW_FOR, ease: "power2.in", modifiers: formatCount }, DRAW_AT);

      /* Pills pop the moment the head passes their point. */
      milestones.forEach(function (m) {
        tl.to(m.el, { scale: 1, duration: 0.45, ease: "back.out(2.6)" }, m.at);
      });

      /* 3.8s: volume bars rise behind the curve. */
      tl.to(barEls, { scaleY: 1, duration: 0.6, ease: "power3.out", stagger: 0.035 }, 3.8);

      /* 4.6s: the camera pushes in on the peak; the head pulses. */
      tl.to("#cam", { scale: 1.16, duration: 1.4, ease: "power2.inOut" }, 4.6);
      tl.to("#head", { scale: 1.6, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 3 }, 4.8);

      /* 6.2s: everything retracts to the empty grid… */
      tl.to("#cam", { scale: 1, duration: 0.8, ease: "power3.inOut" }, 6.2);
      tl.to(milestones.map(function (m) { return m.el; }), { scale: 0, duration: 0.3, ease: "back.in(2)", stagger: 0.05 }, 6.2);
      tl.to(curve, { drawSVG: "100% 100%", duration: 0.7, ease: "power3.in" }, 6.3);
      tl.to("#reveal-rect", { attr: { x: X1 + 20, width: 0 }, duration: 0.7, ease: "power3.in" }, 6.3);
      tl.to(barEls, { scaleY: 0, duration: 0.4, ease: "power3.in", stagger: { each: 0.02, from: "end" } }, 6.3);
      tl.to("#head", { scale: 0, duration: 0.3, ease: "back.in(2)" }, 6.9);
      tl.to(["#count", "#label"], { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 6.6);

      /* …and the grid wipes away, back to the opening frame. */
      tl.to("#grid line", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.5, ease: "power3.in", stagger: 0.03 }, 7.1);
      tl.set("#grid line", { transformOrigin: "0% 50%" }, 7.9);
      tl.set("#reveal-rect", { attr: { x: X0, width: 0 } }, 7.9);
      tl.set(curve, { drawSVG: "0% 0%" }, 7.9);
      tl.set({}, {}, 8);

      window.__timelines = window.__timelines || {};
      window.__timelines["signal"] = tl;
    </script>
  </body>
</html>
