<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta data-composition-id="make-it-move" data-width="1920" data-height="1080" />
    <title>Make it move</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07142e; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07142e; isolation: isolate; }

      .line { position: absolute; left: 150px; height: 300px; width: 1700px; overflow: hidden; }
      .slice {
        position: absolute; left: 0; top: 0; width: 1700px; height: 300px;
        font-family: "Anton", sans-serif; font-size: 286px; line-height: 300px; letter-spacing: 4px;
        color: #f7f5ef; white-space: nowrap;
      }
      .slice .ltr { display: inline-block; transform-origin: 50% 100%; }
      .s0 { clip-path: inset(0 0 66.6% 0); }
      .s1 { clip-path: inset(33.3% 0 33.3% 0); }
      .s2 { clip-path: inset(66.6% 0 0 0); }
      #ln0 { top: 96px; }
      #ln1 { top: 390px; }
      #ln2 { top: 684px; }

      #disc {
        position: absolute; left: 0; top: 0; width: 760px; height: 760px; margin: -380px 0 0 -380px;
        border-radius: 50%; background: #c5ef26; mix-blend-mode: difference; z-index: 3;
      }
      #note {
        position: absolute; right: 150px; top: 890px; width: 760px; z-index: 2;
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 44px; line-height: 1.25;
        color: #f7f5ef; text-align: right; opacity: 0;
      }
      #note b { color: #c5ef26; font-weight: 700; }

      .bar {
        position: absolute; top: -200px; left: 0; width: 2600px; height: 1480px; z-index: 5;
        transform: skewX(-18deg);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="line" id="ln0" data-word="MAKE"></div>
      <div class="line" id="ln1" data-word="IT"></div>
      <div class="line" id="ln2" data-word="MOVE."></div>
      <div id="note">One sentence in.<br /><b>Sixty frames a second</b>&nbsp;out.</div>
      <div id="disc"></div>
      <div id="bars"></div>
    </div>

    <script src="player.js"></script>
    <script>
      /* Each line is three stacked copies, clipped to thirds, so it can slice apart. */
      gsap.utils.toArray(".line").forEach(function (line) {
        var word = line.getAttribute("data-word");
        var html = word.split("").map(function (c) { return '<span class="ltr">' + c + "</span>"; }).join("");
        line.innerHTML = [0, 1, 2].map(function (i) {
          return '<div class="slice s' + i + '"><div class="inner">' + html + "</div></div>";
        }).join("");
      });
      var barColors = ["#c5ef26", "#7fb2ff", "#f7f5ef", "#8b6cff", "#ff5b45", "#07142e"];
      document.getElementById("bars").innerHTML = barColors
        .map(function (c) { return '<div class="bar" style="background:' + c + '"></div>'; })
        .join("");

      var inners = gsap.utils.toArray(".line .inner");
      var slicesOf = function (id) { return gsap.utils.toArray("#" + id + " .slice"); };
      var moveLetters = gsap.utils.toArray("#ln2 .ltr");
      var allSlices = gsap.utils.toArray(".slice");
      var bars = gsap.utils.toArray(".bar");

      gsap.set(inners, { yPercent: 105 });
      gsap.set("#disc", { x: 1400, y: 460, scale: 0 });
      gsap.set(bars, { x: -2900 });

      var tl = gsap.timeline({ paused: true });

      /* 0–1.1s: the three lines slam up out of their masks. */
      ["ln0", "ln1", "ln2"].forEach(function (id, i) {
        tl.to("#" + id + " .inner", { yPercent: 0, duration: 0.75, ease: "expo.out" }, 0.1 + i * 0.14);
      });
      tl.to("#note", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.9);

      /* 0.7s: the disc grows, then sweeps over the type, inverting it. */
      tl.to("#disc", { scale: 1, duration: 0.8, ease: "back.out(1.7)" }, 0.7);
      tl.to("#disc", { x: 560, y: 520, duration: 1.3, ease: "power3.inOut" }, 1.6);
      tl.to("#disc", { x: 1300, y: 500, scale: 0.72, duration: 1.1, ease: "power3.inOut" }, 3.0);

      /* 2.2s & 2.75s: glitch slices on the beat, then snap back. */
      [[2.2, "ln1"], [2.75, "ln0"], [3.3, "ln2"]].forEach(function (hit) {
        var s = slicesOf(hit[1]);
        tl.to(s[0], { x: -90, duration: 0.06, ease: "none" }, hit[0]);
        tl.to(s[2], { x: 120, duration: 0.06, ease: "none" }, hit[0]);
        tl.to(s[1], { x: 40, duration: 0.06, ease: "none" }, hit[0]);
        tl.to(s, { x: 0, duration: 0.22, ease: "elastic.out(1, 0.4)" }, hit[0] + 0.12);
      });

      /* 3.9s: MOVE squashes letter by letter and springs back. */
      tl.to(moveLetters, { scaleY: 0.6, scaleX: 1.12, duration: 0.2, ease: "power2.out", stagger: 0.07 }, 3.9);
      tl.to(moveLetters, { scaleY: 1, scaleX: 1, duration: 0.5, ease: "elastic.out(1, 0.35)", stagger: 0.07 }, 4.14);

      /* 4.6s: palette flip — coral page, navy type. */
      tl.to("#stage", { backgroundColor: "#ff5b45", duration: 0.35, ease: "power2.inOut" }, 4.6);
      tl.to(allSlices, { color: "#07142e", duration: 0.35, ease: "power2.inOut" }, 4.6);
      tl.to("#note", { color: "#07142e", duration: 0.35 }, 4.6);
      tl.to("#note b", { color: "#f7f5ef", duration: 0.35 }, 4.6);
      tl.to("#disc", { x: 1500, y: 340, scale: 1.1, backgroundColor: "#f7f5ef", duration: 0.9, ease: "power3.inOut" }, 4.6);

      /* 5.6s: a six-colour shutter wipe covers everything… */
      tl.to(bars, { x: -360, duration: 0.7, ease: "power4.inOut", stagger: 0.07 }, 5.6);

      /* …everything resets underneath it… */
      tl.set("#stage", { backgroundColor: "#07142e" }, 6.75);
      tl.set(allSlices, { color: "#f7f5ef" }, 6.75);
      tl.set("#note", { color: "#f7f5ef", opacity: 0 }, 6.75);
      tl.set("#note b", { color: "#c5ef26" }, 6.75);
      tl.set(inners, { yPercent: 105 }, 6.75);
      tl.set("#disc", { x: 1400, y: 460, scale: 0, backgroundColor: "#c5ef26" }, 6.75);

      /* …and the bars sweep off to the blank navy frame the loop starts from. */
      tl.to(bars, { x: 2900, duration: 0.7, ease: "power4.inOut", stagger: { each: 0.06, from: "end" } }, 6.8);
      tl.set(bars, { x: -2900 }, 7.8);
      tl.set({}, {}, 8);

      window.__timelines = window.__timelines || {};
      window.__timelines["make-it-move"] = tl;
    </script>
  </body>
</html>
