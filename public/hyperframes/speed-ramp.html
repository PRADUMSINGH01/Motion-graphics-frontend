<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta data-composition-id="speed-ramp" data-width="1920" data-height="1080" />
    <title>Speed ramp</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #03060c; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #03060c; }

      /* Four panels side by side; whip pans slide the strip. Panel 4 repeats panel 1's
         opening frame so the loop is seamless. */
      #strip { position: absolute; left: 0; top: 0; width: 7680px; height: 1080px; filter: url(#whip); }
      .panel { position: absolute; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #p1, #p4 { left: 0; background: radial-gradient(ellipse 60% 60% at 50% 55%, #0b1a3a 0%, #03060c 70%); }
      #p2 { left: 1920px; background: #f7f5ef; }
      #p3 { left: 3840px; background: #c5ef26; }
      #p4 { left: 5760px; }
      .inner { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 50%; }

      /* Panel 1: a light sweep travels across a giant 60. */
      #sixty {
        position: absolute; left: 0; top: 120px; width: 1920px; text-align: center;
        font-family: "Anton", sans-serif; font-size: 700px; line-height: 1; letter-spacing: 10px;
        color: transparent; -webkit-background-clip: text; background-clip: text;
        background-image: linear-gradient(100deg, #f7f5ef 0%, #f7f5ef 40%, #c5ef26 47%, #ffffff 50%, #1c2f58 60%, #1c2f58 100%);
        background-size: 300% 100%; background-position: 100% 0;
      }
      #fps {
        position: absolute; left: 0; top: 840px; width: 1920px; text-align: center;
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 56px; letter-spacing: 4px;
        color: rgba(247, 245, 239, 0.75);
      }

      /* Panel 2: camera-move words crash in one per beat. */
      .move {
        position: absolute; left: 0; width: 1920px; text-align: center;
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 190px;
        letter-spacing: -8px; line-height: 1; color: #07142e;
      }
      .move span { color: #ff5b45; }
      #m1 { top: 170px; }
      #m2 { top: 430px; }
      #m3 { top: 690px; }

      /* Panel 3: the line. */
      #shot {
        position: absolute; left: 0; top: 230px; width: 1920px; text-align: center;
        font-family: "Caveat", cursive; font-weight: 700; font-size: 150px; color: #07142e;
      }
      #sentence {
        position: absolute; left: 0; top: 400px; width: 1920px; text-align: center;
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 280px;
        letter-spacing: -14px; line-height: 1; color: #07142e;
      }
      #mark { position: absolute; left: 50%; top: 790px; display: flex; align-items: center; gap: 22px; transform: translateX(-50%); }
      #mark svg { width: 70px; height: 77px; }
      #mark span { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 86px; letter-spacing: -4px; color: #07142e; }

      #grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0.08; mix-blend-mode: overlay; pointer-events: none; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="whip" x="-5%" y="0" width="110%" height="100%">
          <feGaussianBlur id="whip-blur" stdDeviation="0 0" />
        </filter>
      </defs>
    </svg>
    <div id="stage">
      <div id="strip">
        <div class="panel" id="p1">
          <div class="inner" id="i1">
            <div id="sixty">60</div>
            <div id="fps">frames every second</div>
          </div>
        </div>
        <div class="panel" id="p2">
          <div class="inner" id="i2">
            <div class="move" id="m1">Whip pan<span>.</span></div>
            <div class="move" id="m2">Crash zoom<span>.</span></div>
            <div class="move" id="m3">Speed ramp<span>.</span></div>
          </div>
        </div>
        <div class="panel" id="p3">
          <div class="inner" id="i3">
            <div id="shot">all shot on</div>
            <div id="sentence">a sentence.</div>
            <div id="mark">
              <svg viewBox="0 0 210 230" aria-hidden="true"><path d="M18 14 L196 115 L18 216 Z" fill="#07142e" stroke="#07142e" stroke-width="20" stroke-linejoin="round" /></svg>
              <span>byreel</span>
            </div>
          </div>
        </div>
        <div class="panel" id="p4"></div>
      </div>
      <svg id="grain" viewBox="0 0 1920 1080" aria-hidden="true">
        <filter id="noise"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1" /></filter>
        <rect width="1920" height="1080" filter="url(#noise)" />
      </svg>
    </div>

    <script src="player.js"></script>
    <script>
      var moves = gsap.utils.toArray(".move");

      gsap.set("#sixty", { opacity: 0, scale: 1.08 });
      gsap.set("#fps", { opacity: 0, y: 30 });
      gsap.set(moves, { opacity: 0, scale: 2.6, filter: "blur(26px)" });
      gsap.set(["#shot", "#sentence", "#mark"], { opacity: 0, y: 40 });

      var tl = gsap.timeline({ paused: true });
      tl.to("#turb", { attr: { seed: 240 }, duration: 8, ease: "steps(240)" }, 0);

      /* One whip pan: the strip slides a panel with a speed ramp (slow-fast-slow) and a
         horizontal motion-blur streak that peaks mid-move. */
      function whip(at, toPanel) {
        tl.to("#strip", { x: -1920 * toPanel, duration: 0.5, ease: "expo.inOut" }, at);
        tl.to("#whip-blur", { attr: { stdDeviation: "140 0" }, duration: 0.25, ease: "power2.in" }, at);
        tl.to("#whip-blur", { attr: { stdDeviation: "0 0" }, duration: 0.25, ease: "power2.out" }, at + 0.25);
      }

      /* 0.1–2.0s — panel 1: the 60 resolves, a light sweep crosses it, slow push-in. */
      tl.to("#sixty", { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 0.1);
      tl.to("#sixty", { backgroundPosition: "0% 0", duration: 1.5, ease: "power2.inOut" }, 0.4);
      tl.to("#fps", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);
      tl.fromTo("#i1", { scale: 1 }, { scale: 1.07, duration: 2.2, ease: "none" }, 0);

      whip(2.0, 1);

      /* 2.5–4.3s — panel 2: each camera move crash-zooms in on the beat. */
      [2.5, 3.0, 3.5].forEach(function (t, i) {
        tl.to(moves[i], { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, t);
      });
      tl.fromTo("#i2", { scale: 1 }, { scale: 1.05, duration: 2.0, ease: "none" }, 2.4);
      tl.to(moves, { x: 30, duration: 0.06, ease: "none", yoyo: true, repeat: 1 }, 3.82);

      whip(4.4, 2);

      /* 4.9–6.8s — panel 3: the line lands, then the mark. */
      tl.to("#shot", { opacity: 1, y: 0, rotation: -2, duration: 0.5, ease: "back.out(2)" }, 4.9);
      tl.to("#sentence", { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 5.05);
      tl.to("#mark", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.5);
      tl.fromTo("#i3", { scale: 1 }, { scale: 1.06, duration: 2.4, ease: "none" }, 4.8);

      /* 6.9s — whip onto panel 4, a copy of the opening frame, then jump back to panel 1. */
      whip(6.9, 3);
      tl.set("#strip", { x: 0 }, 7.9);
      tl.set("#sixty", { opacity: 0, scale: 1.08, backgroundPosition: "100% 0" }, 7.9);
      tl.set("#fps", { opacity: 0, y: 30 }, 7.9);
      tl.set(moves, { opacity: 0, scale: 2.6, filter: "blur(26px)", x: 0 }, 7.9);
      tl.set(["#shot", "#sentence", "#mark"], { opacity: 0, y: 40, rotation: 0 }, 7.9);
      tl.set({}, {}, 8);

      window.__timelines = window.__timelines || {};
      window.__timelines["speed-ramp"] = tl;
    </script>
  </body>
</html>
