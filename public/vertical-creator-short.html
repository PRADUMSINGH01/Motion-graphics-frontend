<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>9:16 Vertical Creator Short</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #102048 0%, #050b18 75%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .ambient-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(197, 239, 38, 0.16) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .phone-rig {
    position: relative;
    width: 340px; height: 610px;
    border-radius: 38px;
    background: #071126;
    border: 3px solid rgba(255, 255, 255, 0.24);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
    padding: 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
    animation: phoneFloat 3.8s ease-in-out infinite;
  }
  .Dynamic-island {
    width: 96px; height: 22px; border-radius: 999px;
    background: #000; margin: 0 auto;
  }
  .broll-card {
    margin-top: 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 20px; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .tag {
    align-self: flex-start;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(197, 239, 38, 0.2);
    color: #c5ef26; font-family: monospace; font-size: 11px; font-weight: 800;
  }
  .chart-row {
    display: flex; align-items: flex-end; gap: 8px; height: 110px;
  }
  .col {
    flex: 1; border-radius: 6px;
    background: linear-gradient(180deg, #c5ef26, rgba(197, 239, 38, 0.2));
    transform-origin: bottom;
    animation: growCol 2.2s ease-in-out infinite alternate;
  }
  .col:nth-child(1) { height: 35%; }
  .col:nth-child(2) { height: 55%; animation-delay: 0.15s; }
  .col:nth-child(3) { height: 75%; animation-delay: 0.3s; }
  .col:nth-child(4) { height: 96%; animation-delay: 0.45s; }
  .captions-box {
    text-align: center; margin: auto 0;
  }
  .cap-line {
    font-size: 27px; font-weight: 900; color: #fff;
    line-height: 1.15; letter-spacing: -0.03em;
    text-transform: uppercase;
  }
  .cap-word-active {
    display: inline-block;
    background: #c5ef26; color: #07142e;
    padding: 2px 10px; border-radius: 6px;
    transform: rotate(-1.5deg);
    animation: popWord 1.2s ease-in-out infinite alternate;
  }
  .bottom-ui {
    display: flex; align-items: center; justify-content: space-between;
    font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.65);
    border-top: 1px solid rgba(255,255,255,0.12); padding-top: 12px;
  }
  @keyframes phoneFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  @keyframes growCol {
    0% { transform: scaleY(0.5); }
    100% { transform: scaleY(1); }
  }
  @keyframes popWord {
    0% { transform: scale(0.95) rotate(-1.5deg); }
    100% { transform: scale(1.06) rotate(1deg); }
  }
</style>
</head>
<body>
  <div class="ambient-grid"></div>
  <div class="phone-rig">
    <div class="Dynamic-island"></div>
    <div class="broll-card">
      <span class="tag">RETENTION HOOK +84%</span>
      <div class="chart-row">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>
    </div>
    <div class="captions-box">
      <div class="cap-line">STOP POSTING</div>
      <div class="cap-line" style="margin:6px 0;"><span class="cap-word-active">STATIC VIDEOS</span></div>
      <div class="cap-line">ON REELS &amp; SHORTS</div>
    </div>
    <div class="bottom-ui">
      <span>9:16 VERTICAL</span>
      <span style="color:#c5ef26;font-weight:700;">60 FPS EXPORT</span>
    </div>
  </div>
</body>
</html>
