<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Byreel Electric Lime Gradients -->
    <linearGradient id="limeGradPrimary" x1="120" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2ff6b" />
      <stop offset="45%" stop-color="#c5ef26" />
      <stop offset="100%" stop-color="#8bb807" />
    </linearGradient>

    <linearGradient id="limeGradHighlight" x1="180" y1="140" x2="340" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#e8ff85" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c5ef26" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="darkRibbonFold" x1="200" y1="200" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a3805" />
      <stop offset="60%" stop-color="#141a02" />
      <stop offset="100%" stop-color="#0a0d01" />
    </linearGradient>

    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#c5ef26" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="120" fill="#111110" />

  <!-- Outer Fine Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="rgba(197, 239, 38, 0.2)" stroke-width="4" fill="none" />

  <!-- Byreel 3D Ribbon Glyph -->
  <g filter="url(#limeGlow)">
    <!-- Back Fold -->
    <path
      d="M 180 340 C 150 310, 140 240, 180 180 C 220 120, 290 120, 340 160 C 370 185, 380 230, 360 270 L 300 240 C 310 215, 305 190, 285 175 C 255 155, 215 155, 195 190 C 175 225, 180 265, 205 290 Z"
      fill="url(#darkRibbonFold)"
    />

    <!-- Main Dynamic Foreground Ribbon -->
    <path
      d="M 160 330 C 130 270, 150 180, 220 140 C 280 105, 360 125, 380 190 C 395 240, 370 300, 310 340 C 250 380, 180 370, 160 330 Z"
      fill="url(#limeGradPrimary)"
    />

    <!-- Inner Core Cutout for 3D Loop -->
    <path
      d="M 220 280 C 190 250, 195 200, 230 180 C 265 160, 310 170, 325 205 C 335 230, 320 265, 285 285 C 260 295, 235 295, 220 280 Z"
      fill="#111110"
    />

    <!-- High-Gloss Refraction Sweep -->
    <path
      d="M 210 145 C 270 115, 350 135, 370 190 C 350 160, 290 140, 230 160 Z"
      fill="url(#limeGradHighlight)"
    />
  </g>
</svg>
