<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Toss → Clock Cut</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Helvetica,Arial,sans-serif}
  #stage{position:fixed;inset:0}
  /* ---------- SHOT 1 : hand + phone ---------- */
  #shot1{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%, #3b4252 0%, #23272e 60%, #16181c 100%)}
  #phone{
    position:absolute;left:50%;top:52%;width:190px;height:380px;margin:-190px 0 0 -95px;
    background:linear-gradient(160deg,#2c2f36,#14161a);border-radius:28px;
    box-shadow:0 30px 60px rgba(0,0,0,.6), inset 0 0 0 3px #4a4f58;
    transform-origin:50% 80%;
  }
  #phone .screen{
    position:absolute;inset:10px;border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,#1b2a4a,#0d1524);
  }
  #phone .screen .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(120,160,255,.35),transparent 60%)}
  #phone .screen .notch{position:absolute;top:8px;left:50%;width:70px;height:16px;margin-left:-35px;background:#000;border-radius:10px}
  #phone .screen .time{
    position:absolute;top:60px;width:100%;text-align:center;color:#dfe8ff;
    font-size:34px;font-weight:200;letter-spacing:2px;
  }
  #phone .screen .lock{position:absolute;bottom:60px;width:100%;text-align:center;color:#8fa3c8;font-size:13px;letter-spacing:3px}
  /* forearm coming from bottom of frame */
  #arm{
    position:absolute;left:50%;bottom:-260px;width:120px;height:520px;margin-left:-60px;
    background:linear-gradient(90deg,#b98a6b,#d8a880 45%,#a97c5f);
    border-radius:60px 60px 0 0;
  }
  #hand{
    position:absolute;left:50%;top:-58px;width:150px;height:150px;margin-left:-75px;
  }
  .finger{position:absolute;bottom:55px;width:34px;height:78px;background:#d8a880;border-radius:17px;box-shadow:inset -4px 0 6px rgba(0,0,0,.25)}
  .f1{left:2px;transform:rotate(-6deg)}
  .f2{left:40px;transform:rotate(-2deg)}
  .f3{left:78px;transform:rotate(2deg)}
  .f4{left:114px;transform:rotate(7deg)}
  .thumb{position:absolute;left:-14px;bottom:30px;width:36px;height:92px;background:#d8a880;border-radius:18px;transform:rotate(28deg)}
  .palm{position:absolute;left:0;bottom:0;width:150px;height:96px;background:#d8a880;border-radius:26px}
  /* phone shadow on background */
  #pshadow{position:absolute;left:50%;top:70%;width:240px;height:40px;margin-left:-120px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
  /* ---------- SHOT 2 : clock ---------- */
  #shot2{position:absolute;inset:0;background:linear-gradient(180deg,#e9e4da 0%,#d8d1c3 100%);opacity:0}
  #wall{position:absolute;inset:0;background:linear-gradient(180deg,#efe9de,#ddd5c6)}
  #clock{
    position:absolute;left:50%;top:46%;width:340px;height:340px;margin:-170px 0 0 -170px;
    background:#fbf8f1;border-radius:50%;
    box-shadow:0 18px 40px rgba(0,0,0,.22), inset 0 0 0 14px #2e2a26, inset 0 0 0 18px #8d857a;
  }
  .tick{position:absolute;left:50%;top:50%;width:4px;height:14px;background:#2e2a26;margin-left:-2px;transform-origin:50% 156px}
  .tick.major{width:7px;height:24px;margin-left:-3.5px;transform-origin:50% 156px;background:#171310}
  #hand-h{position:absolute;left:50%;top:50%;width:8px;height:96px;background:#171310;margin-left:-4px;border-radius:4px;transform-origin:50% 100%}
  #hand-m{position:absolute;left:50%;top:50%;width:6px;height:134px;background:#171310;margin-left:-3px;border-radius:3px;transform-origin:50% 100%}
  #hand-s{position:absolute;left:50%;top:50%;width:2.5px;height:146px;background:#c0392b;margin-left:-1.25px;transform-origin:50% 100%}
  #pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;background:#c0392b;border-radius:50%;box-shadow:0 0 0 3px #171310}
  #desk{position:absolute;left:0;bottom:0;width:100%;height:22%;background:linear-gradient(180deg,#a8906b,#8a7454);box-shadow:0 -8px 20px rgba(0,0,0,.15)}
  #deskshadow{position:absolute;left:12%;bottom:20%;width:180px;height:22px;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(6px)}
  #pencil{position:absolute;left:14%;bottom:20.5%;width:170px;height:12px;border-radius:6px;background:linear-gradient(180deg,#f4c542,#d9a520);box-shadow:0 3px 5px rgba(0,0,0,.25)}
  #pencil::before{content:"";position:absolute;right:-14px;top:0;width:0;height:0;border-left:15px solid #e8d5b0;border-top:6px solid transparent;border-bottom:6px solid transparent}
  #pencil::after{content:"";position:absolute;right:-14px;top:0;width:6px;height:12px;background:#3a3a3a;clip-path:polygon(0 30%,100% 0,0 70%)}
  /* sound-of-toss impact flash */
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #cutflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  /* caption */
  #caption{position:absolute;left:0;right:0;bottom:36px;text-align:center;color:#e8e3d8;font-size:15px;letter-spacing:5px;text-transform:uppercase;opacity:0}
</style>
</head>
<body>
<div id="stage">

  <!-- SHOT 1 -->
  <div id="shot1">
    <div id="pshadow"></div>
    <div id="armRig" style="position:absolute;left:50%;top:52%;width:0;height:0">
      <div id="arm">
        <div id="hand">
          <div class="finger f1"></div><div class="finger f2"></div>
          <div class="finger f3"></div><div class="finger f4"></div>
          <div class="thumb"></div><div class="palm"></div>
        </div>
      </div>
      <div id="phone">
        <div class="screen">
          <div class="glow"></div>
          <div class="notch"></div>
          <div class="time">9:41</div>
          <div class="lock">SLIDE TO UNLOCK</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SHOT 2 -->
  <div id="shot2">
    <div id="wall"></div>
    <div id="desk"></div>
    <div id="deskshadow"></div>
    <div id="pencil"></div>
    <div id="clock"></div>
  </div>

  <div id="flash"></div>
  <div id="cutflash"></div>
  <div id="caption">no calls today</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
// build clock ticks
const clock = document.getElementById('clock');
for (let i=0;i<60;i++){
  const t=document.createElement('div');
  t.className='tick'+(i%5===0?' major':'');
  t.style.transform=`rotate(${i*6}deg) translateY(-156px)`;
  t.style.top='0';t.style.left='50%';t.style.position='absolute';
  t.style.transformOrigin='50% 0';
  t.style.height=(i%5===0?24:14)+'px';
  t.style.width=(i%5===0?7:4)+'px';
  t.style.marginLeft=(-(i%5===0?7:4)/2)+'px';
  t.style.background=i%5===0?'#171310':'#5a534a';
  clock.appendChild(t);
}
// hands
const hh=document.createElement('div');hh.id='hand-h';clock.appendChild(hh);
const hm=document.createElement('div');hm.id='hand-m';clock.appendChild(hm);
const hs=document.createElement('div');hs.id='hand-s';clock.appendChild(hs);
const pin=document.createElement('div');pin.id='pin';clock.appendChild(pin);

gsap.set('#armRig',{x:0,y:0});
gsap.set('#phone',{rotate:0});

// clock time state
const now=new Date();
let sec=now.getSeconds(), min=now.getMinutes(), hr=now.getHours()%12;
function drawClock(){
  hs.style.transform=`rotate(${sec*6}deg)`;
  hm.style.transform=`rotate(${min*6+sec*0.1}deg)`;
  hh.style.transform=`rotate(${hr*30+min*0.5}deg)`;
}
drawClock();

const tl = gsap.timeline();

// SHOT 1 — arm rises into frame holding phone at arm's length
tl.from('#arm',{y:340,duration:1.1,ease:'power3.out'})
  .from('#pshadow',{scale:.6,opacity:0,duration:1.1,ease:'power3.out'},'<')
  // slight idle sway — holding steady at arm's length
  .to('#armRig',{rotation:2,duration:1.2,ease:'sine.inOut',transformOrigin:'50% 400px'},'+=0.3')
  .to('#armRig',{rotation:-1.5,duration:1.2,ease:'sine.inOut'})
  // toss: quick wind-up then whip out of frame, spinning
  .to('#phone',{y:-24,rotate:-6,duration:0.25,ease:'power2.in'})
  .to('#phone',{
      x:1400,y:-500,rotate:720,duration:0.7,ease:'power1.in'
  },'-=0.05')
  .to('#flash',{opacity:.35,duration:.08},'<0.35')
  .to('#flash',{opacity:0,duration:.25})
  // arm follows through, dropping out of frame
  .to('#arm',{y:420,duration:0.6,ease:'power2.in'},'<0.05')
  .to('#pshadow',{opacity:0,duration:0.4},'<')
  // beat — empty frame
  .to('#shot1',{duration:0.5});

// THE CUT
tl.to('#cutflash',{opacity:1,duration:0.06})
  .set('#shot1',{display:'none'})
  .set('#shot2',{opacity:1})
  .to('#cutflash',{opacity:0,duration:0.15})
  .from('#clock',{scale:.9,opacity:0,duration:0.6,ease:'power2.out'})
  .from(['#desk','#pencil'],{y:60,opacity:0,duration:0.7,ease:'power3.out'},'<0.1')
  .to('#caption',{opacity:.85,duration:0.8},'-=0.3')
  .to('#caption',{opacity:0,duration:1},'+=2');

// clock ticking (frame-by-frame in rAF for the steady shot)
let running=false;
function tickLoop(){
  sec++;
  if(sec>=60){sec=0;min++;if(min>=60){min=0;hr=(hr+1)%12;}}
  drawClock();
  setTimeout(()=>{ if(running) tickLoop(); },1000);
}
setTimeout(()=>{running=true;tickLoop();}, 6800); // start ticking right after the cut
</script>
</body>
</html>
