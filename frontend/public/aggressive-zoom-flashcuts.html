<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AGGRESSIVE ZOOM — Flash Cuts</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #frame{position:relative;width:100vw;height:100vh;overflow:hidden;background:#050505;}

  /* ---------- HOST SCENE ---------- */
  #hostScene{position:absolute;inset:0;background:#0a0a0f;overflow:hidden;}
  #hostWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    transform-origin:62% 42%; will-change:transform;}
  svg.face{width:min(70vh,60vw);}

  /* dramatic light layers */
  #keyLight{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 55% 60% at 62% 38%, rgba(255,255,255,.14), transparent 60%);}
  #shadowLayer{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
    background:linear-gradient(115deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.2) 45%, rgba(0,0,0,.9) 100%);}
  #rimLight{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
    background:radial-gradient(circle at 78% 25%, rgba(255,60,40,.55), transparent 45%);}
  #vignette{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 25vw 8vw rgba(0,0,0,.92);}
  #grain{position:absolute;inset:-50px;pointer-events:none;opacity:.07;
    background-image:repeating-conic-gradient(#fff 0 .0001%, #000 0 .0002%);
    animation:grain .12s steps(3) infinite;}
  @keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-8px,5px)}66%{transform:translate(6px,-7px)}100%{transform:translate(0,0)}}

  /* ---------- FLASH CUTS ---------- */
  .cut{position:absolute;inset:0;display:none;align-items:center;justify-content:center;}
  .cut.on{display:flex;}
  .cut .bg{position:absolute;inset:0;}
  .iconBig{font-size:22vw;filter:drop-shadow(0 0 40px rgba(255,255,255,.5));z-index:2;}
  .cutLabel{position:absolute;bottom:8vh;left:0;right:0;text-align:center;z-index:3;
    color:#fff;font-size:5vw;letter-spacing:.2em;text-transform:uppercase;
    text-shadow:3px 3px 0 #000;}
  .scanline{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 5px);}

  /* UI chrome */
  #recTag{position:absolute;top:3vh;left:3vw;color:#ff2b2b;font-size:2.2vw;letter-spacing:.3em;z-index:10;
    animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:.15}}
  #timecode{position:absolute;top:3vh;right:3vw;color:#ddd;font-size:2vw;z-index:10;font-family:monospace;}
  #shakeLayer{position:absolute;inset:0;will-change:transform;}

  .hardShadow{filter:drop-shadow(8px 8px 0 rgba(0,0,0,.8));}
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <div id="shakeLayer">

      <!-- ============ HOST ============ -->
      <div id="hostScene">
        <div id="hostWrap">
          <svg class="face" viewBox="0 0 400 400">
            <defs>
              <radialGradient id="skin" cx="60%" cy="35%">
                <stop offset="0%" stop-color="#f2c9a0"/>
                <stop offset="60%" stop-color="#c98d5e"/>
                <stop offset="100%" stop-color="#5e3418"/>
              </radialGradient>
              <radialGradient id="eyeG" cx="50%" cy="40%">
                <stop offset="0%" stop-color="#fff"/>
                <stop offset="100%" stop-color="#8899aa"/>
              </radialGradient>
            </defs>
            <!-- neck/shoulders -->
            <ellipse cx="200" cy="430" rx="180" ry="120" fill="#22283a"/>
            <rect x="165" y="330" width="70" height="90" rx="30" fill="#b57850"/>
            <!-- head -->
            <ellipse cx="200" cy="200" rx="125" ry="150" fill="url(#skin)"/>
            <!-- shadow half (dramatic) -->
            <path d="M200 50 a125 150 0 0 1 0 300 Z" fill="rgba(0,0,0,.45)"/>
            <!-- hair -->
            <path d="M75 190 Q70 40 200 40 Q330 40 325 190 Q320 90 200 85 Q80 90 75 190Z" fill="#1a1410"/>
            <!-- brows (animated angry) -->
            <g id="brows">
              <rect x="120" y="150" width="60" height="12" rx="6" fill="#1a1410" transform="rotate(12 150 156)"/>
              <rect x="220" y="150" width="60" height="12" rx="6" fill="#1a1410" transform="rotate(-12 250 156)"/>
            </g>
            <!-- eyes -->
            <ellipse cx="152" cy="192" rx="26" ry="18" fill="url(#eyeG)"/>
            <ellipse cx="248" cy="192" rx="26" ry="18" fill="url(#eyeG)"/>
            <circle id="pupilL" cx="152" cy="192" r="9" fill="#111"/>
            <circle id="pupilR" cx="248" cy="192" r="9" fill="#111"/>
            <!-- nose -->
            <path d="M200 200 L188 250 Q200 258 212 250" stroke="#7a4520" stroke-width="5" fill="none"/>
            <!-- mouth: starts neutral, gapes on zoom -->
            <path id="mouth" d="M160 292 Q200 300 240 292" stroke="#3a1c0c" stroke-width="8" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div id="keyLight"></div>
        <div id="rimLight"></div>
        <div id="shadowLayer"></div>
        <div id="vignette"></div>
      </div>

      <!-- ============ FLASH CUTS ============ -->
      <div class="cut" data-i="0">
        <div class="bg" style="background:radial-gradient(circle,#e63946,#5c0008)"></div>
        <div class="iconBig">🤡</div><div class="cutLabel">NO CONTEXT</div><div class="scanline"></div>
      </div>
      <div class="cut" data-i="1">
        <div class="bg" style="background:linear-gradient(135deg,#111,#003049)"></div>
        <div class="iconBig">📰</div><div class="cutLabel">BREAKING!!!</div><div class="scanline"></div>
      </div>
      <div class="cut" data-i="2">
        <div class="bg" style="background:linear-gradient(45deg,#ff006e,#8338ec)"></div>
        <div class="iconBig">💃</div><div class="cutLabel">DANCE TREND</div><div class="scanline"></div>
      </div>
      <div class="cut" data-i="3">
        <div class="bg" style="background:radial-gradient(circle,#ffbe0b,#3a2800)"></div>
        <div class="iconBig">🔥</div><div class="cutLabel">VIRAL</div><div class="scanline"></div>
      </div>
      <div class="cut" data-i="4">
        <div class="bg" style="background:linear-gradient(160deg,#04151f,#183a37)"></div>
        <div class="iconBig">👽</div><div class="cutLabel">UNEXPLAINED</div><div class="scanline"></div>
      </div>
      <div class="cut" data-i="5">
        <div class="bg" style="background:linear-gradient(135deg,#2b2d42,#d90429)"></div>
        <div class="iconBig">😱</div><div class="cutLabel">YOU WON'T BELIEVE</div><div class="scanline"></div>
      </div>

      <div id="grain"></div>
      <div id="recTag">● REC</div>
      <div id="timecode">00:00:00:00</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const { gsap } = window;

// ---------- TIMECODE ----------
let start = performance.now();
setInterval(()=>{
  const t = (performance.now()-start)/1000;
  const f = Math.floor((t%1)*24);
  const s = Math.floor(t%60), m = Math.floor(t/60);
  document.getElementById('timecode').textContent =
    `00:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
}, 40);

// ---------- AGGRESSIVE ZOOM + LIGHTING ----------
const tl = gsap.timeline({repeat:-1, repeatDelay:1.2});

tl.set('#rimLight',{opacity:0})
  .set('#mouth',{attr:{d:'M160 292 Q200 300 240 292'}})
  .set('#hostWrap',{scale:1, x:0, y:0, rotation:0})

  // small settle then SNAP zoom
  .to('#hostWrap',{scale:1.06, duration:.6, ease:'power2.out'})
  .to('#hostWrap',{scale:4.2, x:'-9%', y:'-4%', rotation:1.5, duration:.35, ease:'power4.in'},'+=0.4')
  // mouth drops open, pupils shrink
  .to('#mouth',{attr:{d:'M150 285 Q200 335 250 285'}, duration:.2, ease:'power2.out'},'<')
  .to('#pupilL,#pupilR',{attr:{r:5}, duration:.2},'<')
  .to('#brows',{y:-8, duration:.2},'<')

  // dramatic lighting: key light dies, hard shadow slams, red rim flare pulses
  .to('#keyLight',{opacity:0, duration:.3},'<')
  .to('#shadowLayer',{opacity:1, background:'linear-gradient(100deg, rgba(0,0,0,.97) 0%, rgba(0,0,0,.45) 35%, rgba(0,0,0,.95) 100%)', duration:.3},'<')
  .to('#rimLight',{opacity:1, duration:.12, ease:'steps(3)'},'<')
  .to('#rimLight',{opacity:.2, duration:.1, repeat:5, yoyo:true, ease:'none'},'<')

  // camera shake on impact
  .to('#shakeLayer',{x:8,y:-6, duration:.05, repeat:7, yoyo:true, ease:'none'},'<-0.05')
  .to('#shakeLayer',{x:0,y:0,duration:.1})

  .to('#hostScene',{opacity:1, duration:.5},'+=0.8')

  // ---------- FLASH CUTS: rapid, random ----------
  const cuts = [...document.querySelectorAll('.cut')];
  let order = [0,3,1,5,2,4,0,2,5,1,3,0,4,2];
  order.forEach(i=>{
    tl.set(cuts,{className:'cut'})
      .set(cuts[i],{className:'cut on'})
      .fromTo(cuts[i],{scale:1.35},{scale:1.05, duration:.22, ease:'power2.out'},'<')
      .to(cuts[i],{duration:.1}); // hold
  });

  // snap back to host face, tighter & angrier
  tl.set('#hostScene',{opacity:1})
    .set(cuts,{className:'cut'})
    .to('#hostWrap',{scale:5.5, x:'-12%', duration:.12, ease:'power4.in'})
    .to('#rimLight',{opacity:1, duration:.1})
    .to('#shakeLayer',{x:12,y:8,duration:.05,repeat:5,yoyo:true})
    .to('#shakeLayer',{x:0,y:0,duration:.1})
    .to('#mouth',{attr:{d:'M140 280 Q200 350 260 280'}, duration:.3},'<')
    .to({},{duration:1});
</script>
</body>
</html>
