<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Screen — Analog Struggle vs. Digital Scroll</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#000; font-family:"Helvetica Neue",Arial,sans-serif; }

  .split { display:flex; height:100vh; width:100vw; }
  .half { position:relative; width:50%; height:100%; overflow:hidden; }

  /* ---------- LEFT : B&W READER ---------- */
  #left {
    background: radial-gradient(circle at 50% 40%, #d8d8d8 0%, #8a8a8a 55%, #3c3c3c 100%);
    filter: grayscale(1) contrast(1.15);
  }
  /* film grain */
  #left::after {
    content:""; position:absolute; inset:-50%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity:.14; animation: grain .35s steps(3) infinite; pointer-events:none;
  }
  @keyframes grain { 0%{transform:translate(0,0)} 33%{transform:translate(-3%,2%)} 66%{transform:translate(2%,-3%)} 100%{transform:translate(0,0)} }

  .reader-scene { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; }
  .reader-svg { width:88%; height:88%; }

  .head-bob { animation: strain 2.4s ease-in-out infinite; transform-origin: 300px 300px; }
  @keyframes strain {
    0%,100% { transform: rotate(0deg) translateY(0); }
    15% { transform: rotate(-3deg) translateY(2px); }
    30% { transform: rotate(2deg) translateY(-1px); }
    55% { transform: rotate(-4deg) translateY(3px); }
    75% { transform: rotate(1deg) translateY(0); }
  }
  .squint-l { animation: squint 3.1s ease-in-out infinite; transform-origin:center; }
  .squint-r { animation: squint 3.1s ease-in-out .12s infinite; transform-origin:center; }
  @keyframes squint { 0%,100%{transform:scaleY(1)} 40%{transform:scaleY(.15)} 60%{transform:scaleY(.3)} }
  .page-flip { animation: flip 4.5s ease-in-out infinite; transform-origin: 320px 470px; }
  @keyframes flip { 0%,70%{transform:rotate(0)} 80%{transform:rotate(-14deg) skewX(6deg)} 90%{transform:rotate(0)} }
  .rub { animation: rub 3.1s ease-in-out infinite; }
  @keyframes rub { 0%,55%,100%{transform:translateY(0)} 70%{transform:translateY(-14px) rotate(-8deg)} }

  /* letter drift — words won't hold still */
  .letters text { animation: drift 2.6s ease-in-out infinite; }
  .letters text:nth-child(2n){ animation-delay:-.9s; }
  .letters text:nth-child(3n){ animation-delay:-1.7s; }
  @keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(6px)} }

  /* ---------- RIGHT : SATURATED SWIPER ---------- */
  #right {
    background: radial-gradient(circle at 50% 35%, #ff2fd4 0%, #7a00ff 45%, #00143d 100%);
    filter: saturate(2.4) contrast(1.2) hue-rotate(-6deg);
  }
  #right::after {
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 4px);
    pointer-events:none;
  }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }

  .swiper-scene { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; }
  .swiper-svg { width:88%; height:88%; }

  .swipe-hand { animation: swipe .55s cubic-bezier(.2,.9,.3,1) infinite; }
  @keyframes swipe {
    0%   { transform: translateY(60px); }
    45%  { transform: translateY(-30px); }
    100% { transform: translateY(60px); }
  }
  .thumb-flick { animation: flick .55s ease-out infinite; transform-origin:560px 430px; }
  @keyframes flick { 0%,100%{transform:rotate(0)} 45%{transform:rotate(-18deg)} }
  .head-nod { animation: nod 1.1s ease-in-out infinite; transform-origin:740px 280px; }
  @keyframes nod { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(3deg)} }
  .body-pulse { animation: pulse .55s ease-in-out infinite; transform-origin:740px 640px; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.012)} }

  .content-card { animation: cardfly .55s linear infinite; }
  .content-card.c2 { animation-delay:.18s; }
  .content-card.c3 { animation-delay:.36s; }
  @keyframes cardfly {
    0%   { transform: translateY(-140px); opacity:0; }
    15%  { opacity:1; }
    80%  { opacity:1; }
    100% { transform: translateY(220px); opacity:0; }
  }
  .screen-glow { animation: glow .9s ease-in-out infinite; }
  @keyframes glow { 0%,100%{opacity:.25} 50%{opacity:.55} }

  /* ---------- LABELS ---------- */
  .label {
    position:absolute; top:34px; left:38px; z-index:5;
    color:#fff; text-transform:uppercase; letter-spacing:.28em;
    font-size:13px; font-weight:600; opacity:.9;
  }
  .label small { display:block; letter-spacing:.14em; font-weight:400; font-size:10px; opacity:.65; margin-top:6px; }
  #left .label  { color:#111; }
  .divider {
    position:absolute; left:50%; top:0; width:4px; height:100%;
    background:#fff; transform:translateX(-50%); z-index:4;
    box-shadow:0 0 30px rgba(255,255,255,.7);
  }
  .counter {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    z-index:6; color:#fff; font-weight:800; font-size:22px; letter-spacing:.05em;
    text-shadow:0 0 12px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div class="split">

  <!-- ================= LEFT : B&W STRUGGLING READER ================= -->
  <section class="half" id="left">
    <div class="label">22:47<small>Reading · Chapter VII</small></div>

    <div class="reader-scene">
      <svg class="reader-svg" viewBox="0 0 600 600">
        <!-- chair -->
        <rect x="180" y="470" width="240" height="18" rx="6" fill="#2b2b2b"/>
        <rect x="195" y="488" width="16" height="90" fill="#2b2b2b"/>
        <rect x="390" y="488" width="16" height="90" fill="#2b2b2b"/>
        <!-- body -->
        <g class="head-bob">
          <path d="M300 320 C 260 340, 250 420, 258 475 L 342 475 C 350 420, 340 340, 300 320 Z" fill="#1f1f1f"/>
          <!-- head -->
          <circle cx="300" cy="285" r="48" fill="#e9e9e9"/>
          <path d="M252 275 q48 -55 96 0 l0 -20 q-48 -40 -96 0 Z" fill="#3a3a3a"/>
          <!-- strained eyes -->
          <g class="squint-l"><ellipse cx="282" cy="288" rx="9" ry="6" fill="#1a1a1a"/></g>
          <g class="squint-r"><ellipse cx="318" cy="288" rx="9" ry="6" fill="#1a1a1a"/></g>
          <!-- furrowed brows -->
          <path d="M270 274 l24 8" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
          <path d="M330 274 l-24 8" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
          <!-- tense mouth -->
          <path d="M288 308 q12 -6 24 0" stroke="#5a5a5a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- sweat drop -->
          <path class="rub" d="M348 258 q6 12 0 16 q-6 -4 0 -16" fill="#bdbdbd"/>
        </g>
        <!-- arms + book -->
        <g class="page-flip">
          <path d="M258 400 q-40 40 -18 78 l30 -8" fill="none" stroke="#e9e9e9" stroke-width="16" stroke-linecap="round"/>
          <path d="M342 400 q40 40 18 78 l-30 -8" fill="none" stroke="#e9e9e9" stroke-width="16" stroke-linecap="round"/>
          <path d="M250 468 q50 -26 100 0 l0 10 q-50 22 -100 0 Z" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
          <g class="letters" fill="#555" font-size="9" font-family="Georgia,serif">
            <text x="258" y="468">wqer tyui opas</text>
            <text x="258" y="458">dfg hjkl zxcv</text>
            <text x="312" y="468">bnm ,qwe rt</text>
          </g>
        </g>
        <!-- vignette -->
        <rect x="0" y="0" width="600" height="600" fill="url(#vigL)"/>
        <defs>
          <radialGradient id="vigL" cx="50%" cy="45%" r="70%">
            <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,.55)"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
  </section>

  <!-- ================= RIGHT : AGGRESSIVE SWIPER ================= -->
  <section class="half" id="right">
    <div class="label">FEED · ∞<small>swiping · dopamine loop</small></div>
    <div class="flash" id="flash"></div>

    <div class="swiper-scene">
      <svg class="swiper-svg" viewBox="0 0 900 700">
        <!-- body -->
        <g class="body-pulse">
          <path d="M740 380 C 660 400, 640 540, 652 660 L 828 660 C 840 540, 820 400, 740 380 Z" fill="#12003a"/>
          <!-- head -->
          <g class="head-nod">
            <circle cx="740" cy="290" r="58" fill="#ffd1a8"/>
            <path d="M682 280 q58 -68 116 0 l0 -26 q-58 -48 -116 0 Z" fill="#2b0a5e"/>
            <!-- glow-lit face, lit from below by phone -->
            <ellipse cx="718" cy="300" rx="8" ry="5" fill="#12003a"/>
            <ellipse cx="762" cy="300" rx="8" ry="5" fill="#12003a"/>
            <path d="M712 330 q28 14 56 0" stroke="#12003a" stroke-width="4" fill="none" stroke-linecap="round"/>
            <!-- blue light on face -->
            <ellipse cx="740" cy="322" rx="44" ry="22" fill="#00e5ff" opacity=".22"/>
          </g>
        </g>

        <!-- phone screen glow -->
        <rect class="screen-glow" x="480" y="300" width="180" height="300" rx="24" fill="#00e5ff" opacity=".3"/>

        <!-- phone -->
        <g>
          <rect x="490" y="310" width="160" height="280" rx="18" fill="#050014" stroke="#00e5ff" stroke-width="3"/>
          <rect x="500" y="322" width="140" height="256" rx="10" fill="#14004d"/>
          <!-- flying content cards -->
          <g clip-path="url(#screenClip)">
            <g class="content-card">
              <rect x="508" y="380" width="124" height="80" rx="8" fill="#ff2fd4"/>
              <rect x="516" y="390" width="70" height="8" rx="4" fill="#fff" opacity=".85"/>
              <rect x="516" y="404" width="100" height="6" rx="3" fill="#fff" opacity=".5"/>
            </g>
            <g class="content-card c2">
              <rect x="508" y="380" width="124" height="80" rx="8" fill="#ffe600"/>
              <rect x="516" y="390" width="80" height="8" rx="4" fill="#7a00ff"/>
              <rect x="516" y="404" width="95" height="6" rx="3" fill="#7a00ff" opacity=".6"/>
            </g>
            <g class="content-card c3">
              <rect x="508" y="380" width="124" height="80" rx="8" fill="#00ffc3"/>
              <rect x="516" y="390" width="60" height="8" rx="4" fill="#12003a"/>
              <rect x="516" y="404" width="105" height="6" rx="3" fill="#12003a" opacity=".6"/>
            </g>
          </g>
          <defs><clipPath id="screenClip"><rect x="500" y="322" width="140" height="256" rx="10"/></clipPath></defs>
        </g>

        <!-- swiping arm + hand -->
        <g class="swipe-hand">
          <path d="M700 480 q-40 -30 -40 -80" fill="none" stroke="#ffd1a8" stroke-width="24" stroke-linecap="round"/>
          <g class="thumb-flick">
            <ellipse cx="560" cy="420" rx="34" ry="20" fill="#ffd1a8" transform="rotate(-30 560 420)"/>
          </g>
          <!-- motion streaks -->
          <path d="M580 400 l60 -14 M570 425 l70 -16" stroke="#fff" stroke-width="4" opacity=".5" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div class="counter" id="counter">0 swipes</div>
  </section>

  <div class="divider"></div>
</div>

<script>
  // swipe counter + flash sync
  let count = 0;
  const counter = document.getElementById('counter');
  const flash = document.getElementById('flash');
  setInterval(() => {
    count++;
    counter.textContent = count.toLocaleString() + ' swipes';
    flash.animate([{opacity:.35},{opacity:0}], {duration:220, easing:'ease-out'});
  }, 550);

  // optional: swap SVG scenes for real footage by inserting
  // <video src="reader.mp4" autoplay muted loop></video> inside #left,
  // <video src="swiper.mp4" autoplay muted loop></video> inside #right.
</script>
</body>
</html>
