<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro POV — Thumb Scrolling Feed</title>
<style>
  :root{
    --bg:#0a0a0c;
    --card:#1b1b20;
    --card2:#232329;
    --accent:#5b6cff;
    --text:#e8e8ee;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  body{display:flex;align-items:center;justify-content:center;font-family:'Helvetica Neue',Arial,sans-serif}

  /* ---------- shaky cam wrapper ---------- */
  #cam{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    animation:shake 0.14s infinite steps(2);
  }
  @keyframes shake{
    0%  {transform:translate(0px,0px) rotate(0deg)}
    25% {transform:translate(-3px,2px) rotate(0.3deg)}
    50% {transform:translate(2px,-3px) rotate(-0.4deg)}
    75% {transform:translate(-2px,-2px) rotate(0.2deg)}
    100%{transform:translate(3px,1px) rotate(-0.2deg)}
  }

  /* ---------- jump cut flash ---------- */
  #cut{position:fixed;inset:0;background:#000;z-index:50;pointer-events:none;
       animation:cut 2.6s steps(1) forwards}
  @keyframes cut{
    0%,38%{opacity:1}
    38.1%{opacity:0}
    100%{opacity:0}
  }

  /* ---------- phone viewport (macro: crops in tight) ---------- */
  #phone{
    position:relative;
    width:min(430px, 92vw);
    height:min(860px, 96vh);
    overflow:hidden;
    background:#111;
    border-radius:34px;
    transform:scale(1.35); /* macro crop */
    box-shadow:0 0 120px rgba(0,0,0,.9), inset 0 0 40px rgba(0,0,0,.5);
  }

  /* motion-blur sweep overlay across phone during fast scroll */
  #blurSweep{
    position:absolute;inset:0;z-index:10;pointer-events:none;
    backdrop-filter:blur(0px);
    animation:blurPulse 2.2s ease-in-out infinite;
  }
  @keyframes blurPulse{
    0%,100%{backdrop-filter:blur(0px)}
    45%{backdrop-filter:blur(5px)}
  }

  /* ---------- feed ---------- */
  #feed{
    position:absolute;inset:0;
    will-change:transform;
    animation:scrollFeed 2.4s cubic-bezier(.6,0,.9,.2) infinite;
  }
  @keyframes scrollFeed{
    0%{transform:translateY(0)}
    100%{transform:translateY(-3200px)}
  }

  .post{
    padding:14px 12px 18px;
    border-bottom:1px solid #26262c;
    background:var(--card);
  }
  .post:nth-child(even){background:var(--card2)}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 30% 30%, var(--accent), #2a2a55)}
  .name{color:var(--text);font-size:14px;font-weight:600}
  .sub{color:#8a8a95;font-size:11px}
  .img{width:100%;height:210px;border-radius:12px;background:
    linear-gradient(135deg,#3a3a8f,#7a4bd8 45%,#2a8fa0)}
  .img.alt{background:linear-gradient(160deg,#8f3a3a,#d87a4b 60%,#a0c22a)}
  .img.alt2{background:linear-gradient(120deg,#2a7f4f,#3ad8a8 70%)}
  .img.alt3{background:linear-gradient(200deg,#8f3a7a,#d84b7a 50%,#3a3a3a)}
  .caption{color:#c9c9d4;font-size:13px;margin-top:10px;line-height:1.4}
  .actions{display:flex;gap:22px;margin-top:10px;color:#8a8a95;font-size:12px}
  .actions span{display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}

  /* ---------- macro thumb ---------- */
  #thumb{
    position:absolute;z-index:20;
    right:-30px;bottom:-80px;
    width:340px;height:520px;
    filter:blur(3px) drop-shadow(0 -10px 40px rgba(0,0,0,.7));
    transform:rotate(-14deg);
    transform-origin:top center;
    animation:thumbStroke 2.4s cubic-bezier(.6,0,.9,.2) infinite;
  }
  /* thumb blur trails harder than feed blur */
  #thumb .nail{
    animation:blurPulse 2.2s ease-in-out infinite;
  }
  @keyframes thumbStroke{
    0%  {transform:rotate(-14deg) translateY(0px)}
    38% {transform:rotate(-20deg) translateY(-560px)}
    55% {transform:rotate(-20deg) translateY(-560px)}
    100%{transform:rotate(-14deg) translateY(40px)}
  }

  /* handheld vignette + warm macro light */
  #grade{
    position:absolute;inset:0;z-index:30;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(255,180,120,.06), rgba(80,120,255,.05));
    mix-blend-mode:overlay;
  }
  #vig{
    position:absolute;inset:0;z-index:31;pointer-events:none;
    box-shadow:inset 0 0 140px 60px rgba(0,0,0,.75);
  }
</style>
</head>
<body>

<div id="cam">
  <div id="phone">
    <div id="blurSweep"></div>

    <div id="feed">
      <!-- cards generated in duplicate to keep the loop seamless -->
    </div>

    <!-- SVG thumb (macro, slightly out of focus) -->
    <svg id="thumb" viewBox="0 0 340 520" aria-hidden="true">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e8b48c"/>
          <stop offset=".55" stop-color="#d69a70"/>
          <stop offset="1" stop-color="#a8704c"/>
        </linearGradient>
        <linearGradient id="nailG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f2c8ac"/>
          <stop offset="1" stop-color="#d9a37e"/>
        </linearGradient>
      </defs>
      <g class="nail">
        <!-- thumb -->
        <path d="M120 520 C110 380 108 260 130 180 C145 125 185 100 215 115
                 C250 132 255 180 240 235 C220 310 215 420 218 520 Z"
              fill="url(#skin)"/>
        <!-- nail -->
        <path d="M172 130 C186 112 214 110 228 126 C240 142 236 172 222 190
                 C206 208 184 206 172 188 C162 172 160 148 172 130 Z"
              fill="url(#nailG)" opacity=".92"/>
        <ellipse cx="200" cy="155" rx="20" ry="10" fill="#fff" opacity=".25"/>
        <!-- knuckle shading -->
        <path d="M150 260 C180 250 210 255 232 270" stroke="#b57f58" stroke-width="8"
              fill="none" opacity=".35" stroke-linecap="round"/>
        <path d="M146 330 C180 318 212 324 236 342" stroke="#b57f58" stroke-width="8"
              fill="none" opacity=".3" stroke-linecap="round"/>
      </g>
    </svg>

    <div id="grade"></div>
    <div id="vig"></div>
  </div>
</div>

<div id="cut"></div>

<script>
  // build a long feed of varied posts
  const posts = [
    {n:'maya.builds', s:'2h · design', img:'',            cap:'spun up a new landing page today — feedback welcome ✨'},
    {n:'lofi.frames', s:'4h · photo',  img:'alt',         cap:'golden hour, 35mm, no edits'},
    {n:'dev.daily',   s:'6h · code',   img:'alt2',        cap:'shipped v2.0 🚀 changelog in comments'},
    {n:'nora.cooks',  s:'8h · food',   img:'alt3',        cap:'15-minute noodles that actually slap'},
    {n:'atlas.roams', s:'10h · travel',img:'alt',         cap:'somewhere above the clouds ✈️'},
    {n:'pixel.pete',  s:'12h · art',   img:'',            cap:'sketch dump from this week 🎨'},
  ];
  const feed = document.getElementById('feed');
  // duplicate enough times to exceed scroll distance
  let html = '';
  for (let rep = 0; rep < 3; rep++) {
    posts.forEach(p => {
      html += `
      <article class="post">
        <div class="head">
          <div class="avatar"></div>
          <div><div class="name">${p.n}</div><div class="sub">${p.s}</div></div>
        </div>
        <div class="img ${p.img}"></div>
        <div class="caption">${p.cap}</div>
        <div class="actions">
          <span>♡ ${Math.floor(Math.random()*9000+500)}</span>
          <span>💬 ${Math.floor(Math.random()*400+20)}</span>
          <span>↗ Share</span>
        </div>
      </article>`;
    });
  }
  feed.innerHTML = html;
</script>
</body>
</html>
