<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host — Title Card</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #16181d 0%, #050506 70%, #000 100%);
  }
  .host {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 75% at 50% 52%, rgba(120,140,170,.28), transparent 65%),
      radial-gradient(ellipse 18% 30% at 50% 40%, rgba(200,215,235,.22), transparent 70%);
    /* soft suggestion of a figure/face in low light */
  }
  .host::before {
    content: "";
    position: absolute;
    left: 50%; top: 38%;
    width: 26vmin; height: 34vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(190,205,225,.30), rgba(150,170,200,.10) 60%, transparent 75%);
    border-radius: 50%;
    filter: blur(6px);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 90%);
  }
  .grain {
    position: absolute; inset: -50%;
    opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation: grain 0.4s steps(4) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 25% { transform: translate(-2%,1%); }
    50% { transform: translate(1%,-2%); } 75% { transform: translate(-1%,-1%); }
    100% { transform: translate(2%,2%); }
  }
  .title-wrap {
    position: relative;
    text-align: center;
    perspective: 800px;
  }
  .title {
    font-family: "Arial Black", "Helvetica Neue", Impact, sans-serif;
    font-weight: 900;
    font-size: clamp(3rem, 11vw, 9rem);
    letter-spacing: .04em;
    color: #f4f6f9;
    line-height: .95;
    margin: 0;
    text-shadow: 0 0 40px rgba(160,190,255,.25), 0 6px 30px rgba(0,0,0,.8);
    opacity: 0;
  }
  .title .word { display: inline-block; opacity: 0; }
  .sub {
    margin-top: 1.4em;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    letter-spacing: .55em;
    text-transform: uppercase;
    font-size: clamp(.6rem, 1.4vw, 1rem);
    color: rgba(230,235,245,.55);
    opacity: 0;
  }
  .rule {
    width: 0; height: 2px;
    margin: 1.2em auto 0;
    background: linear-gradient(90deg, transparent, rgba(200,220,255,.7), transparent);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="host"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="title-wrap">
    <h1 class="title"><span class="word">SIGNAL</span>&nbsp;<span class="word">LOST</span></h1>
    <div class="sub">a conversation with the machine</div>
    <div class="rule"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

  // Host settles into calm stillness; background drops to black
  tl.from(".host", { opacity: 0, scale: 1.06, duration: 2.2, ease: "power2.out" })
    // dim the ambient figure as text approaches
    .to(".host", { opacity: 0.35, duration: 1.2, ease: "power2.inOut" }, "-=0.6")
    // bold text pops in — punchy scale + slight rotation, words staggered
    .fromTo(".title .word",
      { opacity: 0, scale: 2.4, rotationX: 40, filter: "blur(10px)" },
      { opacity: 1, scale: 1, rotationX: 0, filter: "blur(0px)", duration: 0.55,
        ease: "back.out(2.2)", stagger: 0.14 }, "-=0.3")
    // screen-shake pop on impact
    .fromTo(".stage", { x: -6, y: 4 }, { x: 0, y: 0, duration: 0.35, ease: "elastic.out(1, 0.4)" }, "<")
    // supporting line + rule draw
    .to(".sub", { opacity: 1, duration: 0.9 }, "-=0.1")
    .to(".rule", { width: "42%", duration: 0.8, ease: "power2.inOut" }, "-=0.6");
</script>
</body>
</html>
