<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="#090a0f" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Spider Web Radial Lines Background -->
  <g stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.75" fill="none">
    <circle cx="32" cy="32" r="12" stroke-dasharray="2 3" />
    <circle cx="32" cy="32" r="22" stroke-dasharray="3 4" />
    <line x1="32" y1="32" x2="12" y2="12" />
    <line x1="32" y1="32" x2="52" y2="12" />
    <line x1="32" y1="32" x2="12" y2="52" />
    <line x1="32" y1="32" x2="52" y2="52" />
  </g>

  <!-- Stylized Geometric "A" with Motion Dynamics -->
  <!-- Left Leg -->
  <path d="M 32 12 L 15 50 L 22 50 L 32 25 L 42 50 L 49 50 Z" fill="url(#neonCyan)" filter="url(#glow)" />
  
  <!-- Swirling Kinetic Ribbon Across "A" -->
  <path d="M 12 40 C 22 30, 42 22, 52 32 C 55 35, 52 42, 45 42 C 35 42, 22 46, 16 38" fill="none" stroke="url(#neonPurple)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Motion Flow Accent Arrows / Nodes -->
  <circle cx="52" cy="32" r="2" fill="#38bdf8" />
  <circle cx="22" cy="30" r="1.5" fill="#c084fc" />
  <circle cx="32" cy="12" r="2" fill="#38bdf8" />
</svg>
