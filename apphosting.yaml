# Firebase App Hosting Configuration for Next.js Frontend
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_API_URL
    value: https://motion-studio-api.eastus2.cloudapp.azure.com
    availability:
      - BUILD
      - RUNTIME
